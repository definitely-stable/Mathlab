    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Five TRUE original W32 schemes ALL 90 original source cherries exact shared-global right 6-ID marginals vs independent historic B/A and A/B tags
        run: |
          PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bk_each_cherry_BA.py' -v -k test_02
          PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bk_each_cherry_BA.py' -v -k test_05
  real-W34-nononto-brute-and-physical-gauge:
