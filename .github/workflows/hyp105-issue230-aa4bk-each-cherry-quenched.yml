name: hyp105-issue230-aa4bk-every-true-original-cherry-quenched-BA
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4bk_each_cherry_BA.py"
      - "research/test_hyp105_issue230_d6aa4bk_each_cherry_BA.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4BK-EVERY-CHERRY-QUENCHED-BA.md"
      - ".github/workflows/hyp105-issue230-aa4bk-each-cherry-quenched.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-h-every-root-C4-C6-72d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genuine dyadic h5..80 exact rational each-cherry source C4/6 distinct original right LINE factors and adversarial support 72d floor
        run: |
          PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bk_each_cherry_BA.py' -v -k test_01
          PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bk_each_cherry_BA.py' -v -k test_06
  real-original-W32-all-90-individual-root-marginals:
