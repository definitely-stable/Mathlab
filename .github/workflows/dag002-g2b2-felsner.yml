name: dag002-g2b2-felsner

on:
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "research/dag002_g2b2_felsner.py"
      - "research/test_dag002_g2b2_felsner.py"
      - "docs/research/DAG-002-G2-B2-FELSNER-UPGROWING.md"
      - ".github/workflows/dag002-g2b2-felsner.yml"
  pull_request:
    paths:
      - "research/dag002_g2b2_felsner.py"
      - "research/test_dag002_g2b2_felsner.py"
      - "docs/research/DAG-002-G2-B2-FELSNER-UPGROWING.md"
      - ".github/workflows/dag002-g2b2-felsner.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-felsner-upgrowing-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Exhaustive five-node up-growing order census
        run: python research/dag002_g2b2_felsner.py
      - name: Felsner family invariants and independent DFS exact tests
        run: python -m unittest discover -s research -p 'test_dag002_g2b2_felsner.py' -v
