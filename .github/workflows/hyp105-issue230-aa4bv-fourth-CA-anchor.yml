name: hyp105-issue230-aa4bv-true-original-fourth-CA-anchors
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4bv_fourth_original_GQ_CA_anchors.py"
      - "research/test_hyp105_issue230_d6aa4bv_fourth_original_GQ_CA_anchors.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4BV-FOURTH-CA-ANCHORS.md"
      - ".github/workflows/hyp105-issue230-aa4bv-fourth-CA-anchor.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-h-genuine-GQ-fourth-C-A-cap-and-source-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bv_fourth_original_GQ_CA_anchors.py' -v -k test_01
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bv_fourth_original_GQ_CA_anchors.py' -v -k test_06
  genuine-W32-W34-geometric-anchor-identity-vs-source-brute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bv_fourth_original_GQ_CA_anchors.py' -v -k test_02
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bv_fourth_original_GQ_CA_anchors.py' -v -k test_03
  true-W32-original-historical-seven-C-A-C-B-fourth-Walsh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bv_fourth_original_GQ_CA_anchors.py' -v -k test_04
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bv_fourth_original_GQ_CA_anchors.py' -v -k test_05
