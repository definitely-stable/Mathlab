name: uct005-d1b0-f1-model
on:
  push:
    branches: [research/uct005-d1b0-f1-model-gates]
    paths:
      - "docs/research/UCT-005-G3-B2-D1B0-F1-MODEL.json"
      - "research/uct005_d1b0_f1_reference.py"
      - "research/test_uct005_d1b0_f1_reference.py"
      - ".github/workflows/uct005-d1b0-f1-model.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/research/UCT-005-G3-B2-D1B0-F1-MODEL.json"
      - "research/uct005_d1b0_f1_reference.py"
      - "research/test_uct005_d1b0_f1_reference.py"
      - ".github/workflows/uct005-d1b0-f1-model.yml"

permissions:
  contents: read
jobs:
  f1-model-and-counterconstructions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Independent two-reader PIN, GC, freshness and resource oracles
        run: python -m unittest discover -s research -p 'test_uct005_d1b0_f1_reference.py' -v
      - name: Explicit F1 reference ledger
        run: python research/uct005_d1b0_f1_reference.py
