name: hyp105-k3-local-collision-contract

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3_local_collisions.py"
      - "research/test_hyp105_g5e2b3e1k3_local_collisions.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3-LOCAL-COLLISIONS-BOOK-DICHOTOMY.md"
      - ".github/workflows/hyp105-k3-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  endpoint-collision-falsifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent quadratic path-pair oracle, GQ stars, book counterexample
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3_local_collisions.py' -v
      - name: Deterministic local certificate and K2t obstruction report
        run: python research/hyp105_g5e2b3e1k3_local_collisions.py
