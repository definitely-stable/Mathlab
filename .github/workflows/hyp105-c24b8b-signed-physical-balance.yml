name: hyp105-c24b8b-signed-physical-balance
on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c24b8b_signed_physical_balance.py"
      - "research/test_hyp105_g5e2b3e1c24b8b_signed_physical_balance.py"
      - "research/hyp105_g5e2b3e1c24b8b_w32_signed_witness.py"
      - "docs/research/HYP-105-G5-E2-B3-E1C24B8B-SIGNED-PHYSICAL-BALANCE.md"
      - ".github/workflows/hyp105-c24b8b-signed-physical-balance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  signed-source-balance-original-W32:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: B8-B independent exact physical-template and signed-orbit tests
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c24b8b_signed_physical_balance.py' -v
      - name: B8-B two independent true-original-W32 signed-fiber four-map witnesses
        run: python research/hyp105_g5e2b3e1c24b8b_w32_signed_witness.py
