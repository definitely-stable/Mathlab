name: uct005-d1c1-hypothesis-kill-gate
on:
  push:
    branches:
      - "research/uct005-d1c1-*"
    paths:
      - "research/uct005_d1c1_hypothesis_kill_gate.py"
      - "research/test_uct005_d1c1_hypothesis_kill_gate.py"
      - "docs/research/UCT-005-G3-B2-D1C1-CANDIDATE-GATE.json"
      - ".github/workflows/uct005-d1c1-hypothesis-gate.yml"
  pull_request:
    paths:
      - "research/uct005_d1c1_hypothesis_kill_gate.py"
      - "research/test_uct005_d1c1_hypothesis_kill_gate.py"
      - "docs/research/UCT-005-G3-B2-D1C1-CANDIDATE-GATE.json"
      - ".github/workflows/uct005-d1c1-hypothesis-gate.yml"
permissions:
  contents: read
jobs:
  scoped-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Complete strict model candidate gate and seven live scoped falsifiers
        run: python -m unittest discover -s research -p 'test_uct005_d1c1_hypothesis_kill_gate.py' -v
      - name: Render evidence with all unknown F1 resource axes null
        run: python research/uct005_d1c1_hypothesis_kill_gate.py
      - name: Guard parent observational model and original reference contracts
        run: |
          python -m unittest discover -s research -p 'test_uct005_d1c0_observation_entropy.py' -v
          python -m unittest discover -s research -p 'test_uct005_d1b2f3e_failure_amp.py' -v
          python -m unittest discover -s research -p 'test_uct005_tree.py' -v
