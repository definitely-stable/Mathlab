name: hyp105-issue230-weighted-endpoint

on:
  pull_request:
    paths:
      - 'research/hyp105_w34_independent_oracle.py'
      - 'research/hyp105_w34_weighted_endpoint.py'
      - 'research/test_hyp105_w34_weighted_endpoint.py'
      - 'research/hyp105_weighted_variance_transfer.py'
      - 'research/test_hyp105_weighted_variance_transfer.py'
      - 'research/hyp105_physical_degree_energy.py'
      - 'research/test_hyp105_physical_degree_energy.py'
      - 'research/hyp105_sixflag_pair_collision.py'
      - 'research/test_hyp105_sixflag_pair_collision.py'
      - 'research/hyp105_end_posting_subfield.py'
      - 'research/test_hyp105_end_posting_subfield.py'
      - 'docs/research/HYP-105-END-POSTING-SUBFIELD-INVESTIGATION.md'
      - 'research/hyp105_end_energy_tail_difference.py'
      - 'research/test_hyp105_end_energy_tail_difference.py'
      - 'research/hyp105_physical_rainbow_c6.py'
      - 'research/test_hyp105_physical_rainbow_c6.py'
      - 'research/hyp105_local_coordinate_return_c6.py'
      - 'research/test_hyp105_local_coordinate_return_c6.py'
      - 'research/hyp105_original_source_pencil_wedges.py'
      - 'research/test_hyp105_original_source_pencil_wedges.py'
      - 'research/hyp105_local_return_completion_kernel.py'
      - 'research/test_hyp105_local_return_completion_kernel.py'
      - 'research/hyp105_source_spectral_pencil_wedges.py'
      - 'research/test_hyp105_source_spectral_pencil_wedges.py'
      - 'research/hyp105_coherent_wedge_completion_obstruction.py'
      - 'research/test_hyp105_coherent_wedge_completion_obstruction.py'
      - 'research/hyp105_triple_codegree_d6_compensation.py'
      - 'research/test_hyp105_triple_codegree_d6_compensation.py'
      - 'research/hyp105_pair_codegree_triangle_d6.py'
      - 'research/test_hyp105_pair_codegree_triangle_d6.py'
      - 'research/hyp105_pair_codegree_transversality_kernel.py'
      - 'research/test_hyp105_pair_codegree_transversality_kernel.py'
      - 'docs/research/HYP-105-PAIR-CODEGREE-TRANSVERSALITY-KERNEL.md'
      - 'docs/research/HYP-105-TRIPLE-CODEGREE-D6-COMPENSATION.md'
      - 'docs/research/HYP-105-COHERENT-WEDGE-COMPLETION-NOGO.md'
      - 'docs/research/HYP-105-SOURCE-SPECTRAL-PENCIL-WEDGES.md'
      - 'docs/research/HYP-105-LOCAL-RETURN-COMPLETION-KERNEL.md'
      - 'docs/research/HYP-105-LOCAL-COORDINATE-RETURN-C6.md'
      - 'docs/research/HYP-105-PHYSICAL-RAINBOW-C6.md'
      - 'docs/research/HYP-105-END-ENERGY-TAIL-DIFFERENCE.md'
      - 'docs/research/HYP-105-SIXFLAG-PATH-COLLISIONS.md'
      - 'docs/research/HYP-105-PHYSICAL-DEGREE-ENERGY.md'
      - 'research/test_hyp105_w34_adversarial_certificate.py'
      - 'docs/research/HYP-105-WEIGHTED-ENDPOINT-FRONTIER.md'
      - 'docs/research/HYP-105-WEIGHTED-VARIANCE-TRANSFER.md'
      - '.github/workflows/hyp105-issue230-weighted-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weighted-endpoint-independent-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Recount true symplectic W(3,4) witness and weighted pair 3-walks
        run: |
          python -m unittest discover -s research -p 'test_hyp105_w34_weighted_endpoint.py' -v
          python -m unittest discover -s research -p 'test_hyp105_weighted_variance_transfer.py' -v
          python -m unittest discover -s research -p 'test_hyp105_physical_degree_energy.py' -v
          python -m unittest discover -s research -p 'test_hyp105_sixflag_pair_collision.py' -v
          python -m unittest discover -s research -p 'test_hyp105_end_posting_subfield.py' -v
          python -m unittest discover -s research -p 'test_hyp105_end_energy_tail_difference.py' -v
          python -m unittest discover -s research -p 'test_hyp105_physical_rainbow_c6.py' -v
          python -m unittest discover -s research -p 'test_hyp105_local_coordinate_return_c6.py' -v
          python -m unittest discover -s research -p 'test_hyp105_original_source_pencil_wedges.py' -v
          python -m unittest discover -s research -p 'test_hyp105_local_return_completion_kernel.py' -v
          python -m unittest discover -s research -p 'test_hyp105_source_spectral_pencil_wedges.py' -v
          python -m unittest discover -s research -p 'test_hyp105_coherent_wedge_completion_obstruction.py' -v
          python -m unittest discover -s research -p 'test_hyp105_triple_codegree_d6_compensation.py' -v
          python -m unittest discover -s research -p 'test_hyp105_pair_codegree_triangle_d6.py' -v
          python -m unittest discover -s research -p 'test_hyp105_pair_codegree_transversality_kernel.py' -v
          python -m unittest discover -s research -p 'test_hyp105_w34_adversarial_certificate.py' -v
      - name: Exact dyadic algebra and formal fail-closed gate
        run: |
          python -m unittest discover -s research -p 'test_hyp105_extremal_coordinate_invariants.py' -v
