name: hyp105-issue230-eice003-anchor-lift

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  original-gq-anchor-energy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Original GQ anchor-lifted exact Fraction tensor and independent collision falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_anchor_lift.py' -v
      - name: True ORIGINAL W32 exact end-clean tensor report
        run: python research/hyp105_issue230_anchor_lift.py
      - name: Regression EICE-002 paired source certificate
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_paired_gstar.py'
      - name: Regression EICE-001 full source endpoint energy
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_endpoint_energy.py'
