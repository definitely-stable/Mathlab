name: hyp105-issue230-eice003d-nb-rectangles

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  original-nb-rectangle-proof-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: EICE-003-D original physical NB rectangle and partial matching proofs
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_nb_rectangles.py' -v
      - name: Genuine paired G* W32 rectangle transport exact Fraction report
        run: python research/hyp105_issue230_nb_rectangles.py
      - name: EICE-003-C original midpoint transport and information regressions
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_middle_transport.py'
      - name: EICE-003-B original end-clean covariance regressions
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_centered_anchor.py'
