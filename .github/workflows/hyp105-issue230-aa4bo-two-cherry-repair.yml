name: hyp105-issue230-aa4bo-original-two-cherry-eight-swaps
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4bo_simultaneous_cherry_repair.py"
      - "research/test_hyp105_issue230_d6aa4bo_simultaneous_cherry_repair.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4BO-TWO-ROOT-SIMULTANEOUS-REPAIR.md"
      - ".github/workflows/hyp105-issue230-aa4bo-two-cherry-repair.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-h-pair-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bo_simultaneous_cherry_repair.py' -v -k test_01
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bo_simultaneous_cherry_repair.py' -v -k test_06
  independent-physical-and-W32-original:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bo_simultaneous_cherry_repair.py' -v -k test_02
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bo_simultaneous_cherry_repair.py' -v -k test_03
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bo_simultaneous_cherry_repair.py' -v -k test_05
  genuine-original-W34-GF4-two-root-same-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bo_simultaneous_cherry_repair.py' -v -k test_04
