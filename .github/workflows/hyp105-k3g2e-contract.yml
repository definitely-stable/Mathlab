name: hyp105-k3g2e-seven-family-hall-contract

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3g2e_seven_family_hall.py"
      - "research/test_hyp105_g5e2b3e1k3g2e_seven_family_hall.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3G2E-SEVEN-FAMILY-HALL.md"
      - ".github/workflows/hyp105-k3g2e-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  true-seven-gf5-target-hall:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent true seven-family original-column provenance and GF5/Hall oracles
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3g2e_seven_family_hall.py' -v
      - name: Deterministic W32 seven-family source charging certificate
        run: python research/hyp105_g5e2b3e1k3g2e_seven_family_hall.py
