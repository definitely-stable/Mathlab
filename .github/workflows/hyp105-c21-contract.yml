name: hyp105-c21-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c21-global-right-d6-transfer
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c21_global_right_transfer.py"
      - "research/test_hyp105_g5e2b3e1c21_global_right_transfer.py"
      - ".github/workflows/hyp105-c21-contract.yml"

permissions:
  contents: read

jobs:
  global-right-distinct-and-common-random-D6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C21 all-h distinct-right and shared-random-D6 theorem plus independent GQ W32 falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c21_global_right_transfer.py' -v
      - name: C21 all-h exact rational expectation and four true global W32 reports
        run: python research/hyp105_g5e2b3e1c21_global_right_transfer.py
