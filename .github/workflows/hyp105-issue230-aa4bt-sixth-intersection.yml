name: hyp105-issue230-aa4bt-true-original-GQ-sixth-intersection
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4bt_gq_sixth_order_intersections.py"
      - "research/test_hyp105_issue230_d6aa4bt_gq_sixth_order_intersections.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4BT-GQ-SIXTH-INTERSECTIONS.md"
      - ".github/workflows/hyp105-issue230-aa4bt-sixth-intersection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-h-original-packet-and-class-spectral-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bt_gq_sixth_order_intersections.py' -v -k test_01
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bt_gq_sixth_order_intersections.py' -v -k test_06
  independent-true-W32-W34-GQ-source-intersection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bt_gq_sixth_order_intersections.py' -v -k test_02
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bt_gq_sixth_order_intersections.py' -v -k test_03
  historical-original-W32-all-seven-sixth-64-global-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bt_gq_sixth_order_intersections.py' -v -k test_04
      - run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bt_gq_sixth_order_intersections.py' -v -k test_05
