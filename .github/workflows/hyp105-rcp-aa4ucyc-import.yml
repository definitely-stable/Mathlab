name: hyp105-rcp-aa4ucyc-import

on:
  pull_request:
    paths:
      - "research/rcp/**"
      - "research/test_rcp_aa4ucyc_import.py"
      - "docs/research/hyp105/**"
      - ".github/workflows/hyp105-rcp-aa4ucyc-import.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hyp105-rcp-aa4ucyc-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  scoped-source-test-and-docs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check original-byte SHA, quantifiers and exact W32 rational row
        run: python -m unittest research.test_rcp_aa4ucyc_import -v
      - name: Rebuild canonical source-derived research Markdown
        run: |
          python -m research.rcp.structured_docs --check
          python -m research.rcp.structured_docs --check
      - name: Verify generated Markdown matches canonical registry
        run: python -m research.rcp.structured_docs --check
