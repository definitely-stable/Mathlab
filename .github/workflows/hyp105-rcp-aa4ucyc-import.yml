name: hyp105-rcp-aa4ucyc-import

on:
  pull_request:
    paths:
      - "research/rcp/**"
      - "research/test_rcp_aa4ucyc_import.py"
      - "docs/research/hyp105/**"
      - ".github/workflows/hyp105-rcp-aa4ucyc-import.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hyp105-rcp-aa4ucyc-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  scoped-source-test-and-docs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check original-byte SHA, quantifiers and exact W32 rational row
        run: python -m unittest research.test_rcp_aa4ucyc_import -v
      - name: Rebuild canonical source-derived research Markdown
        run: |
          python -m research.rcp.structured_docs --write
          python -m research.rcp.structured_docs --check
      - name: Commit only generated Markdown in PR branch
        shell: bash
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add docs/research/hyp105/registry/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "RCP-AA4UCYC: regenerate exact formula and proof graph Markdown"
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
      - name: Verify generated Markdown matches canonical registry
        run: python -m research.rcp.structured_docs --check
