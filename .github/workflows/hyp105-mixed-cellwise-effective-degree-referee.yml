name: hyp105-mixed-cellwise-effective-degree-referee

on:
  pull_request:
    paths:
      - '.github/workflows/hyp105-mixed-cellwise-effective-degree-referee.yml'
      - 'docs/research/HYP-105-MIXED-CELLWISE-EFFECTIVE-DEGREE-REFEREE.md'
      - 'research/hyp105_mixed_cellwise_effective_degree_referee.py'
      - 'research/test_hyp105_mixed_cellwise_effective_degree_referee.py'
      - 'research/hyp105_four_internal_blocker_weighted_referee.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-original-full-core-cell-effective-degree:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact all-graph support-weighted Cauchy and independent actual ORIGINAL W32/W34 FULL/CORE mixed blocker
        run: python -m unittest discover -s research -p 'test_hyp105_mixed_cellwise_effective_degree_referee.py' -v
