name: hyp105-k3g2r-fifth-sparse-completion
on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3g2r_fifth_sparse_completion.py"
      - "research/test_hyp105_g5e2b3e1k3g2r_fifth_sparse_completion.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3G2R-FIFTH-SPARSE-COMPLETION.md"
      - ".github/workflows/hyp105-k3g2r-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  exact-original-and-dual-h5-h6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent all-a fifth Johnson completion and true original GQ dual tests
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3g2r_fifth_sparse_completion.py' -v
      - name: Two true coherent W32 original plus dual source rank5 and rank6 signed witness certificates
        run: |
          python research/hyp105_g5e2b3e1k3g2r_fifth_sparse_completion.py > /tmp/hyp105-k3g2r.json
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          r=json.loads(Path("/tmp/hyp105-k3g2r.json").read_text())
          assert r["slice"]=="HYP-105-E1-K3-G2-R"
          assert r["branch_A_B"]=="OPEN"
          assert r["all_a_sparse_unique_fifth_completion_theorem"] is True
          assert r["all_h_two_family_P2_proved"] is False
          assert r["all_h_seven_family_P7_proved"] is False
          all_a=r["physical_complete_all_a_rank0_to6"]
          assert set(all_a)=={"6","9","14"}
          assert all_a["6"]["E0_to_E6"]==[
              [140,143],[0,1],[42,11],[710,1001],
              [86,7],[1182,77],[258,7]]
          for a,entry in all_a.items():
              E=[Fraction(*x) for x in entry["E0_to_E6"]]
              from math import comb
              assert sum(E)==70*comb(int(a),6)
              assert all(v>=0 for v in E)
          models=r["genuine_original_and_dual_GQ_models"]
          assert [m["name"] for m in models]==["lex","hardest-M"]
          for m in models:
              assert m["U_BA"]+m["U_AB"]<=m["S_seven"]
              for side in ("original_BA","genuine_original_dual_AB"):
                  cert=m[side]
                  assert len(cert["rows_permanent_one_two_columns_rank5_rank6"])==2
                  rows=[[Fraction(*x) for x in row]
                        for row in cert["rows_permanent_one_two_columns_rank5_rank6"]]
                  C5=sum(row[0] for row in rows)
                  C6=sum(row[1] for row in rows)
                  assert C5==Fraction(*cert["signed_C5"])
                  assert C6==Fraction(*cert["signed_C6"])
                  assert C5+C6==Fraction(*cert["signed_C56"])
                  assert sum(cert["permanent_one_two_source_masses"])==cert["source_mass"]
              assert Fraction(*m["joint_C5"])==(
                  Fraction(*m["original_BA"]["signed_C5"])+
                  Fraction(*m["genuine_original_dual_AB"]["signed_C5"]))
              assert Fraction(*m["joint_C6"])==(
                  Fraction(*m["original_BA"]["signed_C6"])+
                  Fraction(*m["genuine_original_dual_AB"]["signed_C6"]))
          hard=models[1]
          assert (hard["U_BA"],hard["U_AB"],hard["S_seven"])==(36,39,86)
          assert hard["P2_margin"]==[757,143]
          assert hard["original_BA"]["signed_C56"]==[-56,11]
          assert hard["genuine_original_dual_AB"]["signed_C56"]==[-167,42]
          # Seal complete all-a target spectral prototypes on 6,9,14.
          assert all_a["6"]["h5_path_P6"]==[18,385]
          assert all_a["6"]["h5_C3_plus_P3"]==[-19,770]
          assert all_a["9"]["E0_to_E6"]==[
              [102900,5797],[0,1],[0,1],[35712,493],
              [1436,11],[273240,377],[1988600,403]]
          assert all_a["14"]["E0_to_E6"]==[
              [7357350,110983],[0,1],[2102100,21199],
              [1682278884,3641791],[3853077228,2487593],
              [3749500040,368271],[260563803500,1316961]]
          # Exact signed certificate for SAME hard original f,g:
          # rank-five and rank-six JOINT contributions are BOTH negative.
          assert hard["joint_C5"]==[-2473,462]
          assert hard["joint_C6"]==[-26,7]
          assert hard["original_BA"]["signed_C5"]==[-260,77]
          assert hard["original_BA"]["signed_C6"]==[-12,7]
          assert hard["genuine_original_dual_AB"]["signed_C5"]==[-83,42]
          assert hard["genuine_original_dual_AB"]["signed_C6"]==[-2,1]
          assert hard["original_BA"]["rows_permanent_one_two_columns_rank5_rank6"]==[
              [[-8951,2310],[-99,35]],[[1151,2310],[39,35]]]
          assert hard["genuine_original_dual_AB"]["rows_permanent_one_two_columns_rank5_rank6"]==[
              [[-1703,770],[-208,105]],[[272,1155],[-2,105]]]
          assert models[0]["joint_C5"]==[-3403,4620]
          assert models[0]["joint_C6"]==[422,105]
          print(json.dumps(r,sort_keys=True,indent=2))
          PY
