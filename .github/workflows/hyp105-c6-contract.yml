name: hyp105-c6-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c6-johnson-variance-resistance
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c6_johnson_variance.py"
      - "research/test_hyp105_g5e2b3e1c6_johnson_variance.py"
      - ".github/workflows/hyp105-c6-contract.yml"

permissions:
  contents: read

jobs:
  johnson-global-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent 8 factorial shared permutations and 1128960 transposition pairs
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c6_johnson_variance.py' -v
      - name: Complete true W32 Johnson variance and physical-target report
        run: python research/hyp105_g5e2b3e1c6_johnson_variance.py
