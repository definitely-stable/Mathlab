name: hyp105-rcp-aa4s-import

on:
  pull_request:
    paths:
      - "research/rcp/**"
      - "research/test_rcp_aa4s_import.py"
      - "docs/research/hyp105/**"
      - ".github/workflows/hyp105-rcp-aa4s-import.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hyp105-rcp-aa4s-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  source-math-and-document-parity:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scoped root marginal claims and all original archive SHA pins
        run: python -m unittest research.test_rcp_aa4s_import -v
      - name: Verify all five canonical Markdown registers from pinned math
        run: |
          python -m research.rcp.structured_docs --check
          python -m research.rcp.structured_docs --check
      - name: Reverify deterministic Markdown byte parity
        run: python -m research.rcp.structured_docs --check
