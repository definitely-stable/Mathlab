          python-version: "3.12"
      - name: C20 analytic all-h C6 pressure and independent true W32 / GF4 falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c20_global_left_c6.py' -v
      - name: C20 four genuine W32 full left relabelings and 43740 original Hamilton lifts
        run: python research/hyp105_g5e2b3e1c20_global_left_c6.py
