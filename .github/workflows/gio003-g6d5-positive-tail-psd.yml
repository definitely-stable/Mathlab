name: gio003-g6d5-positive-tail-psd

on:
  push:
    branches:
      - research/gio003-g6d5-positive-tail-psd
    paths:
      - 'research/gio_t3d5_positive_tail.py'
      - 'research/test_gio_t3d5_positive_tail.py'
      - 'docs/research/GIO-003-G6D5-POSITIVE-TAIL-PSD.md'
      - '.github/workflows/gio003-g6d5-positive-tail-psd.yml'
  pull_request:
    paths:
      - 'research/gio_t3d5_positive_tail.py'
      - 'research/test_gio_t3d5_positive_tail.py'
      - 'docs/research/GIO-003-G6D5-POSITIVE-TAIL-PSD.md'
      - '.github/workflows/gio003-g6d5-positive-tail-psd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-positive-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent real source and exact rational PSD witness tests
        run: |
          python -m py_compile research/gio_t3d5_positive_tail.py research/test_gio_t3d5_positive_tail.py
          python -m unittest discover -s research -p 'test_gio_t3d5_positive_tail.py' -v
      - name: Generate and verify conditional positive-tail source certificate
        shell: bash
        run: |
          python research/gio_t3d5_positive_tail.py --out gio003-g6d5-positive-tail-psd.json
          python - <<'PY'
          from fractions import Fraction as Q
          from pathlib import Path
          import json
          z=json.loads(Path('gio003-g6d5-positive-tail-psd.json').read_text())
          assert z["schema"]=="mathlab.gio003.g6d5.positive-tail-psd.v1"
          assert z["issue"]==793
          assert z["parent_G6D4_HEAD"]=="2fc2761fd5cb25db16150b08f60922e937fb05ff"
          assert z["claim"]=="CONDITIONAL_QUADRATIC_T3_POSITIVE_SPECTRAL_TAIL"
          assert z["strict_finite_Wenger5_separation_from_D4_at_same_parameters"]
          assert z["no_infinite_separation_claim"]
          assert z["no_unrestricted_T3_or_ASET"]
          fixtures=z["exact_actual_source_PSD_witnesses"]
          assert len(fixtures)>=9
          for x in fixtures:
              r=x["r"];a=x["source_constants"]
              for side in ("point","line"):
                  d=x["exact_psd_tail_witnesses"][side]
                  assert d["W_PSD_exact_inertia"]["negative"]==0
                  assert d["dominance_PSD_exact_inertia"]["negative"]==0
                  assert d["exact_squared_tail_gate"]
                  assert Q(d["trace_W"])**2<=d["fixed_nu"]**2*r**5
                  assert d["centered_principal_mode_not_counted"]
              assert x["true_original_source_not_synthetic_F"]
              assert x["no_GQ_projection_completion"]
              assert x["original_conflicts_J"]<=a["original_owner_conflict_J0"]*r**4
              assert x["point_original_gram"]**2<=a["original_pencil_Gram_G0"]**2*r**11
              assert x["line_original_gram"]**2<=a["original_pencil_Gram_G0"]**2*r**11
              print("G6D5_REAL_SOURCE",x["kind"],x["scheme"],"r",r,
                  "tail_point",x["exact_psd_tail_witnesses"]["point"]["trace_W"],
                  "tail_line",x["exact_psd_tail_witnesses"]["line"]["trace_W"],
                  "old_rank_gate_fails",x["previous_G6D4_rank_gate_fails_at_same_ell_nu"])
          wg=next(x for x in fixtures if x["kind"]=="wenger5")
          assert wg["original_flags"]==625
          assert wg["actual_Moore_excess_lines"]==40
          assert wg["previous_G6D4_rank_gate_fails_at_same_ell_nu"]
          assert wg["exact_psd_tail_witnesses"]["point"]["trace_W"]=="40"
          assert wg["exact_psd_tail_witnesses"]["line"]["trace_W"]=="40"
          sym=z["published_Wenger_all_order_symbolic_tail_boundary"]
          assert len(sym)==7
          assert all(x["positive_tail_gate_G6D5"] for x in sym if x["q"]<=13)
          assert all(not x["positive_tail_gate_G6D5"] for x in sym if x["q"]>=17)
          assert sym[-2]["positive_tail_exact"]==2176
          for w in z["formal_all_order_source_and_four_error_ledgers"]:
              assert w["FORMAL_ONLY"] and w["no_unrestricted_T3"]
              assert w["source"]["no_positive_outlier_rank_gate"]
              assert w["source"]["no_global_F0_norm_gate"]
              f=w["fixed_before_source"]
              c=w["closure"];m=w["moments"];ss=w["selector"]
              R=int(c["sufficient_r0"]);e=Q(c["eps"]);rho=Q(c["rho"])
              assert m["improper"]<=e*R
              assert m["E"]**2<=e*e*R
              assert m["blocker_D"]**8<=e**8*R
              assert 12*f["balance_b"]**2*rho*ss["q3"]**2*m["L6"]<=e*e
              print("G6D5_FORMAL",f,"rho",c["rho"],"delta",c["delta"])
          print("PASS_GIO003_G6D5_POSITIVE_TAIL_PSD_ORIGINAL_SOURCE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gio003-g6d5-positive-tail-psd-exact-source-witnesses
          path: gio003-g6d5-positive-tail-psd.json
          retention-days: 90
