name: hyp105-aa4-original-heavy-tail-adversarial-frontier

on:
  pull_request:
    paths:
      - '.github/workflows/hyp105-aa4-original-heavy-tail-adversarial-frontier.yml'
      - 'docs/research/HYP-105-AA4-ORIGINAL-HEAVY-TAIL-ADVERSARIAL-FRONTIER.md'
      - 'research/hyp105_original_heavy_tail_adversarial_frontier_referee.py'
      - 'research/test_hyp105_original_heavy_tail_adversarial_frontier_referee.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  true-original-correlated-W32-adversarial-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent genuine ORIGINAL W32 physical tail tests and adversarial source falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_original_heavy_tail_adversarial_frontier_referee.py' -v
      - name: Strict full ORIGINAL W32 adversarial source search and exact Fraction tail certificate
        shell: bash
        run: |
          python research/hyp105_original_heavy_tail_adversarial_frontier_referee.py > tailfrontier.txt
          python - tailfrontier.txt <<'PY'
          from fractions import Fraction
          import json,sys
          p="AA4_TAILFRONTIER_CERTIFICATE="
          contents=open(sys.argv[1],encoding="utf-8").read().strip()
          assert contents.startswith(p),"missing genuine original adversarial tail certificate"
          c=json.loads(contents[len(p):])
          assert c["schema"]=="mathlab.hyp105.original-heavy-tail-adversarial-frontier.v1"
          assert c["issue"]==230 and c["status"]=="OPEN_WITH_FORMAL_BLOCKER"
          assert c["all_h_exact_original_layer_cake_tail_identity_proved"] is True
          assert c["all_h_finite_mesh_original_tail_sandwich_proved"] is True
          assert c["all_h_universal_P_2_over_3_below_quarter_PROVED"] is False
          assert c["all_h_original_B75_proved"] is False
          assert c["root_seven_six_motif_Omega_s6_PROVED"] is False
          assert c["ASET_exponent_claimed"] is False
          assert c["original_f_and_g_each_permute_all_15_pairs"] is True
          assert c["trial_budget"]>=100 and c["finite_float_only_proposals"]>=100
          rows=c["exact_fraction_true_source_candidates"]
          assert len(rows)>=4
          for r in rows:
              M=Fraction(r["exact_original_M"])
              B=Fraction(r["exact_original_B"])
              G=Fraction(r["exact_original_G"])
              P0=Fraction(r["exact_original_weighted_tail_P_0"])
              P1=Fraction(r["exact_original_weighted_tail_P_1_over_2"])
              P2=Fraction(r["exact_original_weighted_tail_P_2_over_3"])
              P3=Fraction(r["exact_original_weighted_tail_P_3_over_4"])
              lo=Fraction(r["exact_original_tail_mesh32_lower"])
              hi=Fraction(r["exact_original_tail_mesh32_upper"])
              assert M>0 and B>=0 and G>0 and G+B==M
              assert r["genuine_original_W32"] is True
              assert r["complete_true_original_source_not_sampling"] is True
              assert r["named_original_flags"]==45
              assert r["owned_actual_physical_opposite_diagonals"]==90
              assert len(set(r["f_pair_perm_indices"]))==15
              assert len(set(r["g_pair_perm_indices"]))==15
              assert 1>=P0>=P1>=P2>=P3>=0
              assert Fraction(r["exact_original_tail_LayerCake_equals_B_over_M"])==B/M
              assert 0<=lo<=B/M<=hi<=1 and hi-lo<=Fraction(1,32)
              assert r["fixed_source_violates_auxiliary_P_2_over_3_below_1_over_4"]==(P2>=Fraction(1,4))
              assert r["fixed_source_violates_global_B75"]==(B/M>=Fraction(3,4))
              assert r["root_PROVED_A"] is False
              print("ORIGINAL_W32",
                    "paths",r["true_original_coordinate_proper_P3s"],
                    "P_1_2",str(P1),
                    "P_2_3",str(P2),
                    "P_3_4",str(P3),
                    "exact_B_over_M",str(B/M),
                    "exact_tail_mesh32_risk_upper",str(hi),
                    "violates_auxiliary_quarter",P2>=Fraction(1,4),
                    "violates_global_B75",B/M>=Fraction(3,4))
          print("BEST_TRUE_ORIGINAL_P_2_3",
                c["best_exact_original_P_2_over_3"]["exact_original_weighted_tail_P_2_over_3"])
          print("ANY_AUXILIARY_QUARTER_GATE_VIOLATED",
                c["at_least_one_exact_original_W32_violates_auxiliary_quarter_gate"])
          print("ROOT_OPEN_WITH_FORMAL_BLOCKER")
          print("ALL_EXACT_TRUE_ORIGINAL_W32_ADVERSARIAL_TAILS_ACCEPTED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyp105-original-correlated-W32-adversarial-heavy-tail-certificate
          path: tailfrontier.txt
          retention-days: 14
