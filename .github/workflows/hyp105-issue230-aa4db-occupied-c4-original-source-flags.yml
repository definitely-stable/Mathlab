    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Genuine W38 lex/random full typed complete global original maps, SAFE->both-occupied C4 true-source mass and independent original C4 witness triple check
        run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4db_occupied_c4_spoke_flag_mass.py' -v -k test_04
  independent_actual_original_complete_Ka_missing_degrees_and_local_failure:
