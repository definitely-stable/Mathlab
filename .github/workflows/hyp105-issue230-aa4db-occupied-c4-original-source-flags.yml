    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Complete original W34 lex/random every true nonincident double-disjoint SOURCE P3 original flag vs two actually occupied AA4-CR canonical physical 4cycle triples
        run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4db_occupied_c4_spoke_flag_mass.py' -v -k test_03
  true_original_W38_both_C4_and_source_crossing_incidence_witness:
