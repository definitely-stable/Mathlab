name: hyp105-coherent-c6-codegree-trace

on:
  pull_request:
    paths:
      - '.github/workflows/hyp105-coherent-c6-codegree-trace.yml'
      - 'research/hyp105_coherent_c6_codegree_trace.py'
      - 'research/test_hyp105_coherent_c6_codegree_trace.py'
      - 'research/hyp105_codegree_triangle_hall_stability.py'
      - 'research/test_hyp105_codegree_triangle_hall_stability.py'
      - 'research/hyp105_saturated_k32_original_sixset_radius2.py'
      - 'research/test_hyp105_saturated_k32_original_sixset_radius2.py'
      - 'research/hyp105_k32_radius2_exact_extension_count.py'
      - 'research/test_hyp105_k32_radius2_exact_extension_count.py'
      - 'research/hyp105_k32_saturated_unit_multiplicity.py'
      - 'research/test_hyp105_k32_saturated_unit_multiplicity.py'
      - 'research/hyp105_saturated_fresh_extension_zero_w34.py'
      - 'research/test_hyp105_saturated_fresh_extension_zero_w34.py'
      - 'research/hyp105_conditional_fresh_line_lift_expectation.py'
      - 'research/test_hyp105_conditional_fresh_line_lift_expectation.py'
      - 'docs/research/HYP-105-CONDITIONAL-FRESH-LINE-LIFT-EXPECTATION.md'
      - 'docs/research/HYP-105-SATURATED-FRESH-ZERO-W34.md'
      - 'docs/research/HYP-105-K32-SATURATED-UNIT-MULTIPLICITY.md'
      - 'docs/research/HYP-105-K32-RADIUS2-EXACT-EXTENSION-COUNT.md'
      - 'docs/research/HYP-105-SATURATED-K32-ORIGINAL-RADIUS2.md'
      - 'docs/research/HYP-105-CODEGREE-TRIANGLE-HALL-STABILITY.md'
      - 'docs/research/HYP-105-COHERENT-C6-CODEGREE-TRACE.md'
      - 'research/hyp105_full_physical_degree_tail.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  original-source-c6-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact codegree C6 identity and genuine original D6
        run: python -m unittest discover -s research -p 'test_hyp105_coherent_c6_codegree_trace.py' -v
      - name: Hall SDR strong-codegree saturation and true original source regressions
        run: python -m unittest discover -s research -p 'test_hyp105_codegree_triangle_hall_stability.py' -v
      - name: Saturated K32 original sixset two-source-ID replacement obstruction
        run: python -m unittest discover -s research -p 'test_hyp105_saturated_k32_original_sixset_radius2.py' -v
      - name: True-original two-flag extension and sixfold multiplicity oracle
        run: python -m unittest discover -s research -p 'test_hyp105_k32_radius2_exact_extension_count.py' -v
      - name: Saturated K32 unit-multiplicity complete original source verification
        run: python -m unittest discover -s research -p 'test_hyp105_k32_saturated_unit_multiplicity.py' -v
      - name: Zero full-H fresh extensions with identical selected original source G
        run: python -m unittest discover -s research -p 'test_hyp105_saturated_fresh_extension_zero_w34.py' -v
      - name: Exact conditional original source line-lift expectation and independent finite enumerator
        run: python -m unittest discover -s research -p 'test_hyp105_conditional_fresh_line_lift_expectation.py' -v
      - name: Parent full physical degree-tail original-source regression
        run: python -m unittest discover -s research -p 'test_hyp105_full_physical_degree_tail.py' -v
