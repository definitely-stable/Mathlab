name: hyp105-rcp-aa4rcyc-import

on:
  pull_request:
    paths:
      - "research/rcp/**"
      - "research/test_rcp_aa4rcyc_import.py"
      - "docs/research/hyp105/**"
      - ".github/workflows/hyp105-rcp-aa4rcyc-import.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hyp105-rcp-aa4rcyc-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  generate-docs-and-verify:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original proof files, mathematical quantifiers and exact rational bounds
        run: python -m unittest research.test_rcp_aa4rcyc_import -v
      - name: Verify full evidence/claim sources and emit four updated structured Markdown views
        run: |
          python -m research.rcp.claim_registry
          python -m research.rcp.evidence_ledger --output /tmp/hyp105-aa4rcyc-ledger
          python -m research.rcp.structured_docs --write
          python -m research.rcp.structured_docs --check
      - name: Commit derived documentation only on the internal draft branch
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add docs/research/hyp105/registry/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "RCP-AA4R: regenerate exact structured Markdown from pinned original D6 claims"
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
      - name: Delete only verified accidental temporary branch
        shell: bash
        run: |
          actual="$(git ls-remote origin refs/heads/__HEAD_REF__ | cut -f1)"
          if [[ "$actual" == "e784bc79e766967c5bfc2cf91e44e1384c5197bb" ]]; then
            git push origin --delete __HEAD_REF__
          elif [[ -n "$actual" ]]; then
            echo "Temporary branch moved unexpectedly; refusing to delete" >&2
            exit 1
          fi
      - name: Verify all registered scientific Markdown is in sync
        run: python -m research.rcp.structured_docs --check
