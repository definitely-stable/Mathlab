name: hyp105-issue230-eice003e-source-plaquettes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  true-original-source-plaquettes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: EICE-003-E exact original W32 W34 2x2 geometry and GQ girth source oracle
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_source_plaquettes.py' -v
      - name: W32 original physical 2x2 plaquette source diagnostic
        run: python research/hyp105_issue230_source_plaquettes.py
      - name: EICE-003-D genuine NB rectangle and all prior regressions
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_nb_rectangles.py' -v
