name: hyp105-issue230-d6aa4an-d-pair-fourflag-transfer
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4an_d_pair_fourflag_transfer.py"
      - "research/test_hyp105_issue230_d6aa4an_d_pair_fourflag_transfer.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4AN-D-PAIR-FOURFLAG-DEGREE2-TRANSFER.md"
      - ".github/workflows/hyp105-issue230-d6aa4an-d-pair-fourflag-transfer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-real-original-all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Nine independent real-source GQ D-FIRST tests, full historical seven classes and K6-K8"
        run: |
          python -m unittest discover -s research -p "test_hyp105_issue230_d6aa4an_d_pair_fourflag_transfer.py" -v
  all-h-exact-true-original-source-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Exact all-h physical 3-shape rooted D tensor and real degree-d flag multipliers"
        run: |
          PYTHONPATH=research python - <<'PY'
          from math import comb
          from hyp105_issue230_d6aa4an_d_pair_fourflag_transfer import all_h_rooted_D_fourflag_shape_capacity
          for h in range(1,61):
              s=1<<h
              v=all_h_rooted_D_fourflag_shape_capacity(s)
              a=v["a"]; d=s+1
              assert v["V"]==(s+1)*(s*s+1)
              assert v["complete_Ka_C6_shape_count"]==(a-3)*(a-4)*(a-5)
              assert v["complete_Ka_two_C3_shape_count"]==comb(a-3,3)
              assert v["complete_Ka_C4_plus_doubled_C2_shape_count"]==(a-3)*comb(a-4,2)
              assert v["full_Ka_exact_unilateral_four_REAL_original_flags"]==(
                  ((a-3)*(a-4)*(a-5)+comb(a-3,3))*d**4+
                  (a-3)*comb(a-4,2)*d*d*comb(d,2))
              assert v["every_genuine_original_D_pair_positive_true_GF5_extension_NOT_PROVED"]
              assert v["root_issue230_A_B_C_not_closed"]
          print("All-h genuine original source unilateral degree-two rooted D tensor PASS, h1..60")
          PY
  independently-original-source-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {power: 1, scheme: S68}
          - {power: 1, scheme: S72}
          - {power: 1, scheme: lex}
          - {power: 1, scheme: reverse}
          - {power: 2, scheme: lex}
          - {power: 2, scheme: random}
          - {power: 3, scheme: lex}
          - {power: 3, scheme: random}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Actual symplectic W32/W34/W38 full global f/g source fourflag tensor and true seven GF5 D-FIRST"
        env:
          POWER: ${{ matrix.power }}
          SCHEME: ${{ matrix.scheme }}
        run: |
          PYTHONPATH=research python - <<'PY'
          import json,os
          from hyp105_issue230_projection import fixture
          from hyp105_issue230_d6aa4an_d_pair_fourflag_transfer import (
              exact_original_W32_D_FIRST_selected_seven,
              physical_unilateral_D_source_completion_census)
          from hyp105_issue230_d6aa4al_global_original_coordinate_transport import _actual_strict_original_transport
          h=int(os.environ["POWER"])
          m=fixture(h,os.environ["SCHEME"])
          if h==1:
              out=exact_original_W32_D_FIRST_selected_seven(m,full_independent=True)
              assert out["genuine_original_D_anchors"]-out["D_FIRST_D_pairs_covered_by_any_selected_seven"]==out["D_FIRST_D_pairs_ZERO_seven_extensions"]
              assert out["INDEPENDENT_historical_Q_FIRST_seven_charge_agreed"]
          else:
              s,V,d,a,f,g,inc,np,nl=_actual_strict_original_transport(m)
              anchor=None
              for i,(p,l) in enumerate(inc):
                  for j in range(i+1,len(inc)):
                      q,n=inc[j]
                      if p!=q and l!=n and set(f[p])&set(f[q]) and set(g[l])&set(g[n]):
                          anchor=(i,j)
                          break
                  if anchor is not None:break
              assert anchor is not None
              one=physical_unilateral_D_source_completion_census(m,anchor,side=0)
              two=physical_unilateral_D_source_completion_census(m,anchor,side=1)
              assert one["exact_one_side_original_four_FLAG_completions_total"]>0
              assert two["exact_one_side_original_four_FLAG_completions_total"]>0
              assert one["a"]==two["a"]
              out={"s":s,"scheme":os.environ["SCHEME"],"original_D_anchor":anchor,
                   "point_side_occupied_shapes":one["actually_occupied_global_physical_2factor_by_shape"],
                   "line_side_occupied_shapes":two["actually_occupied_global_physical_2factor_by_shape"],
                   "point_side_genuine_source_4flag_count":one["exact_one_side_original_four_FLAG_completions_total"],
                   "line_side_genuine_source_4flag_count":two["exact_one_side_original_four_FLAG_completions_total"]}
          print(json.dumps(out,sort_keys=True,indent=2))
          PY
