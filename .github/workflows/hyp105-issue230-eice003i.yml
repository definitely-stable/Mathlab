name: hyp105-issue230-eice003i-original-quadrant-matching

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  true-original-quadrant-source-template:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: EICE-003-I exact original source quadrants and paired diagonal matches
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_quadrant_matching_capacity.py' -v
      - name: W32 W34 full true ORIGINAL source quadrant capacity report
        run: python research/hyp105_issue230_quadrant_matching_capacity.py
      - name: EICE-003-H source fibre and matching parent regressions
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_spectral_source_fibres.py' -v
