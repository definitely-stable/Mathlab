name: research

on:
  push:
    branches:
      - main
      - "research/**"
  pull_request:

permissions:
  contents: read

jobs:
  lent-001-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Research harness (G0 + G1A + G2A)
        run: python research/run_all.py

      - name: Unit tests
        run: python -m unittest discover -s research -p "test_*.py"
