name: research

on:
  push:
    branches:
      - main
      - "research/**"
  pull_request:

permissions:
  contents: read

jobs:
  lent-001-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Research harness (G0 + G1A + G2A)
        run: python research/run_all.py

      - name: Unit tests
        run: python -m unittest discover -s research -p "test_*.py"

      - name: UCT-005 G3-B2-C2-B2-B online file COW author root CAS report
        run: python research/uct005_g3b2c2b2b_online_cow.py

      - name: UCT-005 G3-B2-C2-B2-B independent crash cut and old GC fence tests
        run: python -m unittest discover -s research -p 'test_uct005_g3b2c2b2b_online_cow.py'

      - name: UCT-005 G3-B2-C2-B2-A disk PIN-fenced generation diagnostic
        run: python research/uct005_g3b2c2b2a_fenced_disk_gc.py

      - name: UCT-005 G3-B2-C2-B2-A independent bitmap, crash and retention tests
        run: python -m unittest discover -s research -p 'test_uct005_g3b2c2b2a_fenced_disk_gc.py'

      - name: UCT-005 G3-B2-C2-B1 authenticated journal and generation GC diagnostic
        run: python research/uct005_g3b2c2b1_pin_generation.py

      - name: UCT-005 G3-B2-C2-B1 independent crash-prefix pin and metadata tests
        run: python -m unittest discover -s research -p 'test_uct005_g3b2c2b1_pin_generation.py'

      - name: UCT-005 G3-B2-C2-A actual temp-file bounded-page GC report
        run: python research/uct005_g3b2c2a_disk_gc.py

      - name: UCT-005 G3-B2-C2-A independent queue bitmap pin and corruption tests
        run: python -m unittest discover -s research -p 'test_uct005_g3b2c2a_disk_gc.py'

      - name: UCT-005 G3-B2-C1 charged GC and quantified false lower-bound report
        run: python research/uct005_g3b2c1_gc_frontier.py

      - name: UCT-005 G3-B2-C1 independent pin/reclaim and adversarial tests
        run: python -m unittest discover -s research -p 'test_uct005_g3b2c1_gc_frontier.py'

      - name: UCT-005 G3-B2-C0 exact page-image and crash-prefix oracle
        run: python research/uct005_g3b2c0_pages.py 256

      - name: UCT-005 G3-B2-C0 independent physical-countermodel tests
        run: python -m unittest discover -s research -p 'test_uct005_g3b2c0_pages.py'

      - name: INDEX-001 G2-B4-C5A file-backed atomic-root pinned epoch and page allocator
        run: python research/index001_page_epochs.py

      - name: INDEX-001 G2-B4-C4 paid hybrid two-pass temp-file streaming and mode-choice falsifier
        run: python research/index001_hybrid_streaming.py

      - name: INDEX-001 G2-B4-C3 shared-page streaming RAM and bitmap countermodel
        run: python research/index001_shared_pages.py

      - name: INDEX-001 G2-B4-C2 exact adaptive directory and page reclamation report
        run: python research/index001_adaptive_partition.py

      - name: INDEX-001 G2-B4-C1 bounded double-generation liveness and write gate
        run: python research/index001_double_generation.py

      - name: INDEX-001 G2-B4-C0 exact priced WAL and budgeted architecture report
        run: python research/index001_priced_wal.py

      - name: INDEX-001 G2-B4-B restricted page-image recourse lower-bound report
        run: python research/index001_page_recourse.py

      - name: INDEX-001 G2-B4-A canonical variable range checkpoint witness and bound
        run: python research/index001_variable_checkpoint.py

      - name: INDEX-001 G2-B3-B online checkpoint competitive and adversarial report
        run: python research/index001_online_checkpoint.py

      - name: INDEX-001 G2-B3-A two-generation checkpoint and crash-state report
        run: python research/index001_generation_audit.py

      - name: INDEX-001 G2-B2-B offline checkpoint policy and recovery oracle
        run: python research/index001_checkpoint_policy.py

      - name: INDEX-001 G2-B2 exact filesystem application-byte report
        run: python research/index001_workload_io.py

      - name: HYP-105 G5-C2 deterministic signed-trade density report
        run: python research/hyp105_g5c2_density.py

      - name: HYP-105 G5-C3 bounded deterministic pair-label improvement report
        run: python research/hyp105_g5c3_label_search.py --seed 1 --rounds 6 --probes 12

      - name: HYP-105 G5-C3-B0 exact dual doily geometry and signed-trade report
        run: python research/hyp105_g5c3b0_doily_geometry.py --rounds 4 --probes 8

      - name: HYP-105 B1.0 exact symplectic GF2/GF4 generalized quadrangle construction
        run: python research/hyp105_b1_symplectic.py

      - name: HYP-105 G5-D checksum-weighted GF5 full subset-sum exact certificate
        run: python research/hyp105_g5d_affine_weights.py

      - name: HYP-105 G5-E0 exact prescribed-boundary GF5 flow proofs
        run: python -m unittest discover -s research -p 'test_hyp105_g5e0_boundary_flows.py'

      - name: HYP-105 G5-E1 provable GF5 signed-flow motif filters and risk floor
        run: python research/hyp105_g5e1_motifs.py

      - name: HYP-105 G5-E2-A exact GF2/GF4 symplectic pair-embedding and bounded motif probe
        run: python research/hyp105_g5e2a_pair_embeddings.py

      - name: HYP-105 E2-B1 exact weighted GF5 additive-energy and signed-flow oracles
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b1_energy.py'

      - name: HYP-105 G5-E2-B2 all-s random-label R2 forest/cycle theorem audit
        run: python research/hyp105_g5e2b2_random_r2.py

      - name: HYP-105 G5-E2-B3.0 six-factor-forest projection polynomial and exponent audit
        run: python research/hyp105_g5e2b3_forests.py

      - name: HYP-105 B3.2-E0 sharp random leading GF5 risk constant and forest embedding sandwich
        run: python research/hyp105_g5e2b3e0_random_intensity.py

      - name: HYP-105 B3.2-E0 independently enumerate 600 forest shapes and leading coefficients
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e0_random_intensity.py'

      - name: HYP-105 B3.2-E0 simultaneous weak all-h R2/R3 first-moment selector
        run: python research/hyp105_g5e2b3e0_joint_first_moment.py

      - name: HYP-105 B3.2-E0 independently brute-check lex conditional expectations
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e0_joint_first_moment.py'

      - name: HYP-105 B3.2-E1-C0 exact weighted six-hypergraph B/A overlap and generic packing no-go
        run: python research/hyp105_g5e2b3e1c0_weighted_overlap.py

      - name: HYP-105 B3.2-E1-C0 independent original six-incidence and K6 2factor overlap falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c0_weighted_overlap.py'

      - name: HYP-105 B3.2-E1-B0 same-label seven-family W32 GF5 and Q4 risk floors
        run: python research/hyp105_g5e2b3e1b0_seven_signature.py

      - name: HYP-105 B3.2-E1-B0 independent six-motif tensor, gauge and DFS checks
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1b0_seven_signature.py'

      - name: HYP-105 B3.2-E1-A full W32 fixed-map 62370-candidate GF5 lower census
        run: python research/hyp105_g5e2b3e1a_fixed_leading.py

      - name: HYP-105 B3.2-E1-A independent 10-column brute, bijection gauge and GF5 tests
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1a_fixed_leading.py'

      - name: HYP-105 B3.1-B2-B complete leading nonmatching forest GF5 certificate
        run: python research/hyp105_g5e2b3b2b_leading_forests.py

      - name: HYP-105 B3.1-B2-B independent Fourier/IE/MITM falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3b2b_leading_forests.py'

      - name: HYP-105 B3.1-B2-A nonmatching factor-cherry six-coordinate GF5 census
        run: python research/hyp105_g5e2b3b2_cherry66.py

      - name: HYP-105 B3.1-B2-A independently cross-check cherry GF5 flow oracles
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3b2_cherry66.py'

      - name: HYP-105 E2-B3.1-A all-six GF5 critical 2-factor flow census
        run: python research/hyp105_g5e2b3b1_critical_flows.py

      - name: HYP-105 E2-B3.1-B full six-matching 4-6 coordinate GF5 flow census
        run: python research/hyp105_g5e2b3b_full_matching_flows.py

      - name: HYP-105 E2-B3.1-B1 exact GF5 five-by-six Fourier/graph orbit census
        run: python research/hyp105_g5e2b3b1b_five_six_flows.py

      - name: HYP-105 E2-B3.2 exact coincident six-cycle D_s for GF2/GF4 controls
        run: python research/hyp105_g5e2b3b2_coincident_cycles.py

      - name: HYP-105 E2-B3.3 incidence-matched aligned-label no-go exact report
        run: python research/hyp105_g5e2b3b3_incidence_nogo.py

      - name: HYP-105 E2-B3.2-C Pluecker nonaligned labels and exact GF2/GF4 D_s
        run: python research/hyp105_g5e2b3c_plucker_shift.py

      - name: HYP-105 E2-B3.2-D full four-motif and joint GF5 seven-column certificate
        run: python research/hyp105_g5e2b3d_joint_risk.py

      - name: TOM-001-C exact zero-probe certificate oracle
        run: python research/tom_certificate.py

      - name: External research literature identity and source validation
        run: python research/literature.py --check
      - name: Known/closed/stopped research anti-rediscovery index validation
        run: python research/known_registry.py --check

      - name: TOM-005 seven cross-domain theorem models smoke test
        run: python research/tom005_models.py

      - name: Cross-repository research catalog validation
        run: python research/catalog.py --check

      - name: TOM-003 exact overwrite-state lower bound finite oracle
        run: python research/tom_trust_boundary.py

      - name: G2B signed-collision hypergraph and certified search
        run: python research/lent_hypergraph.py

      - name: HYP-001/002 locality transition constructive falsification
        run: python research/locality_transition.py

      - name: HYP-002 sharp quadratic prefix-fiber theorem checks
        run: python research/hyp002_quadratic.py

      - name: HYP-002-C affine decoder exhaustive CI oracle
        run: python research/affine_two_id.py

      - name: HYP-002-C diagnostic Python comparison (no perf gate)
        run: python research/bench_affine_two_id.py

      - name: G2B-B1 independent weak Sidon upper certificate
        run: python research/lent_weak_sidon.py

      - name: G2B-B1 frozen GF5 witness local exchange audit
        run: python research/lent_g2bb_neighborhood.py

      - name: G2B-B2 anchor orbit and exact cardinality CNF foundation
        run: python research/g2bb2_anchor_sat.py

      - name: TOM-003-D2 authenticated overwrite and multiproof cost gate
        run: python research/tom_authenticated_overwrite.py
