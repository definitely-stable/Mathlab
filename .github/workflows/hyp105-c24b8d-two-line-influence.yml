name: hyp105-c24b8d-two-line-influence

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c24b8d_two_line_influence.py"
      - "research/test_hyp105_g5e2b3e1c24b8d_two_line_influence.py"
      - "research/hyp105_g5e2b3e1c24b8d_w32_influence_witness.py"
      - "docs/research/HYP-105-G5-E2-B3-E1C24B8D-TWO-LINE-INFLUENCE.md"
      - ".github/workflows/hyp105-c24b8d-two-line-influence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-two-line-covariance-and-independent-original-W32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: B8-D fast exact all-h source and two-pin falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c24b8d_two_line_influence.py' -v
      - name: B8-D original W32 105 exact pairs plus independent GQ source-pair witness
        run: python research/hyp105_g5e2b3e1c24b8d_w32_influence_witness.py
