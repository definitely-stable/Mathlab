name: hyp105-c8-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c8-fiber-rearrangement
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c8_fiber_rearrangement.py"
      - "research/test_hyp105_g5e2b3e1c8_fiber_rearrangement.py"
      - ".github/workflows/hyp105-c8-contract.yml"

permissions:
  contents: read

jobs:
  exact-frozen-orbit-fibers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent all-40320 permutation and sixset subset oracles
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c8_fiber_rearrangement.py' -v
      - name: Genuine W32 0 1 2 pin lower and 69 existential upper
        run: python research/hyp105_g5e2b3e1c8_fiber_rearrangement.py
