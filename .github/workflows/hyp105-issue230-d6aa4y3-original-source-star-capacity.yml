name: hyp105-issue230-d6aa4y3-original-source-star-capacity
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4y3_original_source_star_capacity.py"
      - "research/test_hyp105_issue230_d6aa4y3_original_source_star_capacity.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4Y3-ORIGINAL-SOURCE-STAR-CAPACITY.md"
      - ".github/workflows/hyp105-issue230-d6aa4y3-original-source-star-capacity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-h-original-physical-anchored-pattern-theorems:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: All-h original source factor and actual incidence pattern formulae with independent complete physical K6 K7 enumeration
        run: |
          python -m unittest discover -s research -p "test_hyp105_issue230_d6aa4y3_original_source_star_capacity.py" -v
          python research/hyp105_issue230_d6aa4y3_original_source_star_capacity.py > /tmp/y3-original-all-h-capacity.json
          python - <<'PY'
          import json,sys
          x=json.load(open("/tmp/y3-original-all-h-capacity.json"))
          assert x["slice"]=="HYP105-ISSUE230-D6-AA4-Y3-ORIGINAL-SOURCE-STAR-PHYSICAL-CAPACITY"
          assert x["all_h_original_physical_source_anchored_six_ID_star_upper_PROVED"]
          assert x["all_h_two_original_factor_physical_pair_geometry_capacity_PROVED"]
          assert x["all_h_harmful_original_mode_local_swap_upper_PROVED"]
          assert x["root_A"]==x["root_B"]==x["root_C"]=="OPEN"
          z=x["per_order_single_anchored"][0]
          assert z["per_source_star_upper"]==24138
          assert z["per_actual_original_incidence_upper"]==8316
          both=x["per_order_two_marked_edges"][0]
          assert both["adjacent"]["two_source_factor_original_union_upper"]==42444
          assert both["disjoint"]["two_source_factor_original_union_upper"]==36585
          for entry in x["per_order_single_anchored"]:
              assert entry["K"]>=entry["V"]
              assert entry["all_h_true_original_source_factor_half_capacity_PROVED"]
          print("GENUINE ALL-h ORIGINAL GQ PHYSICAL STAR/FLAG/PAIR CAPACITY PASS",len(x["per_order_single_anchored"]),"powers")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyp105-aa4y3-all-h-original-source-star
          path: /tmp/y3-original-all-h-capacity.json
          retention-days: 90
          if-no-files-found: error
  genuine-original-W32-all-sources-flags-physical-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scheme: [S68, S72, lex, reverse]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaust all actual 45 original source incidences, 15 point and line factors and 105 marked physical pairs
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          python research/hyp105_issue230_d6aa4y3_original_source_star_capacity.py --scheme "$SCHEME" > /tmp/y3-real-original-W32-stars.json
          python - <<'PY'
          import os,json
          z=json.load(open("/tmp/y3-real-original-W32-stars.json"))
          assert z["scheme"]==os.environ["SCHEME"] and z["s"]==2
          assert z["true_original_source_GQ_physical_complete_K6_required"]
          for side in ("point","line"):
              q=z["per_typed_side"][side]
              assert q["per_actual_source_factor_ORIGINAL_Q"]==24138
              assert q["per_actual_original_incidence_Q"]==8316
              assert q["adjacent_source_pair_ORIGINAL_Q_union"]==42444
              assert q["disjoint_source_pair_ORIGINAL_Q_union"]==36585
              assert q["source_factors_checked"]==15 and q["actual_source_incidences_checked"]==45
              assert q["actual_source_factor_pairs_checked"]==105
              assert q["pair_classes"]=={"adjacent":60,"disjoint":45}
              assert q["all_62370_TRUE_original_half_Q_exhaustively_visited"]
          assert z["root_A"]==z["root_B"]=="OPEN"
          print("TRUE ORIGINAL",z["scheme"],"ALL 45 FLAG & 15 SOURCE & 105 PAIR PHYSICAL CAPACITIES PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyp105-aa4y3-W32-star-${{ matrix.scheme }}
          path: /tmp/y3-real-original-W32-stars.json
          retention-days: 90
          if-no-files-found: error
  genuine-original-11236-paired-modes-harm-upper:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scheme: [S68, S72]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile independently proven Y2 signed actual original-incidence mode intersection census
        run: |
          g++ -std=c++20 -O3 -Wall -Wextra -pedantic -o /tmp/y3-original-harm research/hyp105_issue230_d6aa4y2_original_signed_conflicts.cpp
      - name: ALL 11025 complete global point-line swap harmful modes vs all-h original two-factor star cap
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          python research/hyp105_issue230_d6aa4y3_original_source_star_capacity.py --scheme "$SCHEME" --native-conflicts /tmp/y3-original-harm > /tmp/y3-original-harm-11236.json
          python - <<'PY'
          import json,os
          z=json.load(open("/tmp/y3-original-harm-11236.json"))
          assert z["scheme"]==os.environ["SCHEME"]
          assert z["mixed_true_original_global_complete_pairs_audited"]==11025
          assert z["historical_Y2_signed_original_mode_11236_rows_read"]==11236
          assert z["all_h_analytical_source_star_harm_upper_verified_on_original_W32"]
          assert z["max_harmful_original_modes"]>0
          assert z["max_harmful_original_modes"]<=2*42444
          assert not z["all_h_original_seven_minimax_Omega_s6_PROVED"]
          assert sum(z["point_line_physical_source_pair_relation_matrix_counts"].values())==11025
          print("TRUE ORIGINAL GF5",z["scheme"],"ALL 11025 JOINT HARM SOURCE-STAR CAPACITIES PASS",z["max_harmful_original_global_witness"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyp105-aa4y3-real-harm-${{ matrix.scheme }}
          path: /tmp/y3-original-harm-11236.json
          retention-days: 90
          if-no-files-found: error
