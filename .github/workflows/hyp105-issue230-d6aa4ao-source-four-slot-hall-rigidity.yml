name: hyp105-issue230-d6aa4ao-source-four-slot-hall-rigidity
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4ao_source_four_slot_hall_rigidity.py"
      - "research/test_hyp105_issue230_d6aa4ao_source_four_slot_hall_rigidity.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4AO-SOURCE-FOURSLOT-HALL-RIGIDITY.md"
      - ".github/workflows/hyp105-issue230-d6aa4ao-source-four-slot-hall-rigidity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-independent-original-four-slot-girth8-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seven independent real W32 W34 W38 and ALL binary 4x4 original source rigidity tests
        run: |
          python -m unittest discover -s research -p "test_hyp105_issue230_d6aa4ao_source_four_slot_hall_rigidity.py" -v
  all-h-exact-integer-original-source-per-template-149:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original all-h source matching A/A<=2, B-containing<=1, K_a Hall upper 149t²
        run: |
          PYTHONPATH=research python - <<'PY'
          from math import comb
          from hyp105_issue230_d6aa4ao_source_four_slot_hall_rigidity import all_h_complete_palette_port_four_slot_Hall_upper
          for h in range(1,81):
              s=1<<h
              v=all_h_complete_palette_port_four_slot_Hall_upper(s)
              t=comb(v["a"]-3,3)
              assert v["full_Ka_per_side_A_port_template_count"]==7*t
              assert v["full_Ka_per_side_B_port_template_count"]==3*t
              assert v["new_ALL_typed_full_Ka_source_Hall_template_charge_upper"]==149*t*t
              assert v["old_naive_parent_twentyfour_source_per_template_upper"]==2400*t*t
              assert 16*149*t*t<2400*t*t
              assert v["issue230_A_B_C_open"]
              assert v["universally_positive_all_D_anchor_selected_seven_NOT_PROVED"]
          print("All genuine W3(2^h) h=1..80 original source slot group Hall cap exact PASS")
          PY
  actual-original-four-factor-pinned-independent-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {power: 1, scheme: S68}
          - {power: 1, scheme: S72}
          - {power: 1, scheme: lex}
          - {power: 1, scheme: reverse}
          - {power: 2, scheme: lex}
          - {power: 2, scheme: random}
          - {power: 3, scheme: lex}
          - {power: 3, scheme: random}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TRUE original globally injected W32/W34/W38 point-line pair maps same source 4 flags
        env:
          POWER: ${{ matrix.power }}
          SCHEME: ${{ matrix.scheme }}
        run: |
          PYTHONPATH=research python - <<'PY'
          import json,os
          from hyp105_issue230_projection import fixture
          from hyp105_issue230_d6aa4ao_source_four_slot_hall_rigidity import (
              exact_true_original_D_anchor_slot_upper,
              exact_true_original_four_slot_Hall_certificate)
          from hyp105_issue230_d6aa4an_port_completion_hall_funnel import physical_D_pair_half_patterns
          from hyp105_issue230_d6aa4al_global_original_coordinate_transport import _actual_strict_original_transport
          m=fixture(int(os.environ["POWER"]),os.environ["SCHEME"])
          s,V,d,a,P,L,inc,np,nl=_actual_strict_original_transport(m)
          anchor=None
          for i,(p,l) in enumerate(inc):
              for j in range(i+1,len(inc)):
                  q,n=inc[j]
                  if p!=q and l!=n and set(P[p])&set(P[q]) and set(L[l])&set(L[n]):
                      anchor=(i,j);break
              if anchor is not None:break
          assert anchor is not None
          if s==2:
              z=exact_true_original_D_anchor_slot_upper(
                  m,anchor,independent_all_templates=True)
              assert z["independent_PARENT_physical_port_six_Q_oracle_check"]=="PASS"
              assert z["exact_true_original_Hall_source_six_ID_Q_extensions"]<=149
          else:
              pp=physical_D_pair_half_patterns(m,anchor,side=0)[
                  "globally_occupied_true_original_source_factor_patterns"]
              ll=physical_D_pair_half_patterns(m,anchor,side=1)[
                  "globally_occupied_true_original_source_factor_patterns"]
              z=exact_true_original_four_slot_Hall_certificate(
                  m,pp[0][1],ll[0][1],pinned=anchor,independent_direct=True)
              assert z["independent_source_EDGE_FIRST_check"]=="PASS"
              assert z["exact_DISTINCT_true_original_four_incidence_Q_completions"]<=z[
                  "new_GQ_repeated_source_factor_matching_rigidity_upper"]
          print(json.dumps({"s":s,"scheme":os.environ["SCHEME"],
               "original_D_pair":anchor,"original_GQ_matching_rigidity":"PASS"},sort_keys=True))
          PY
