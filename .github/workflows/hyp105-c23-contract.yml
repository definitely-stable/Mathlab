name: hyp105-c23-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c23-seven-moment-influence
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c23_seven_moment_influence.py"
      - "research/test_hyp105_g5e2b3e1c23_seven_moment_influence.py"
      - ".github/workflows/hyp105-c23-contract.yml"

permissions:
  contents: read

jobs:
  common-right-seven-mean-and-all-h-swap-influence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C23 exact original GQ all-seven mean, 130 physical targets and all-h swap test
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c23_seven_moment_influence.py' -v
      - name: C23 exact W32 original sixset seven class mean and all-h seven-factor influence report
        run: python research/hyp105_g5e2b3e1c23_seven_moment_influence.py
