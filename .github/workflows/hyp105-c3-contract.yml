name: hyp105-c3-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c3-wedge-pair-alignment
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c3_wedge_alignment.py"
      - "research/test_hyp105_g5e2b3e1c3_wedge_alignment.py"
      - ".github/workflows/hyp105-c3-contract.yml"

permissions:
  contents: read

jobs:
  original-gq-physical-adjacency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent original GQ witness, sharp physical occupancy and 105 swaps
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c3_wedge_alignment.py' -v
      - name: Exact all-h GQ witness alignment bounds and W32 census
        run: python research/hyp105_g5e2b3e1c3_wedge_alignment.py
