name: hyp105-c15-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c15-coupled-right-witness-clusters
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c15_coupled_right_clusters.py"
      - "research/test_hyp105_g5e2b3e1c15_coupled_right_clusters.py"
      - ".github/workflows/hyp105-c15-contract.yml"

permissions:
  contents: read

jobs:
  coupled-original-right-signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: C14 singleton vs C15 signature cluster vs common right finite W32 tests
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c15_coupled_right_clusters.py' -v
      - name: Three branch policies on one true original W32 36 joint-map box
        run: python research/hyp105_g5e2b3e1c15_coupled_right_clusters.py
