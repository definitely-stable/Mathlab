name: hyp105-c16-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c16-two-sided-source-coupling
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c16_two_sided_source.py"
      - "research/test_hyp105_g5e2b3e1c16_two_sided_source.py"
      - ".github/workflows/hyp105-c16-contract.yml"

permissions:
  contents: read

jobs:
  two-sided-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact source-changing C16 seven/GF5 two-sided proof tests
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c16_two_sided_source.py' -v
      - name: Complete W32 36-map source-signature report versus independent exact oracle
        run: python research/hyp105_g5e2b3e1c16_two_sided_source.py
