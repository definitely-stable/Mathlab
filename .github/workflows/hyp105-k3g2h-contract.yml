name: hyp105-k3g2h-full-w32-adversarial-shell

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3g2h_exact_swap_shell.py"
      - "research/test_hyp105_g5e2b3e1k3g2h_exact_swap_shell.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3G2H-EXACT-SWAP-SHELL.md"
      - ".github/workflows/hyp105-k3g2h-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-210-map-w32-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused complete-target and fail-closed tests
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3g2h_exact_swap_shell.py' -v
      - name: Full 210 globally coherent W32 lex transpositions
        run: |
          python research/hyp105_g5e2b3e1k3g2h_exact_swap_shell.py > /tmp/hyp105-k3g2h.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/hyp105-k3g2h.json').read_text())
          assert r['tested_coherent_labelings'] == 210, 'finite shell coverage missing'
          assert r['tested_per_side'] == 105
          assert r['exact_complete_lex_W32_single_swap_shell'] is True
          assert r['unit_hall_failures'] + r['unit_hall_successes'] == 210
          assert r['no_all_h_charge_claimed'] and r['no_all_h_S_omega_claimed']
          assert len(r['swap_shell_results_sha256']) == 64
          assert r['unit_hall_successes'] == 210 and r['unit_hall_failures'] == 0
          assert r['minimum_exact_S'] == {'side':'right','i':2,'j':11,'S_seven_exact':176}
          assert r['maximum_exact_Jcross'] == {'side':'left','i':3,'j':9,'Jcross':47}
          assert r['minimum_S_minus_J'] == {'side':'left','i':1,'j':14,'S_minus_J':139}
          assert r['minimum_local_degree'] == {'side':'right','i':1,'j':8,'min_target_degree':3}
          assert r['swap_shell_results_sha256'] == 'd841d5e6dfb31666df301297843806deb099b3388be842912c3d7658306fc8b7'
          print(json.dumps(r, sort_keys=True, indent=2))
          PY
