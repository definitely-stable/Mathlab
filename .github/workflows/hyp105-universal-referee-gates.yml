name: hyp105-universal-referee-gates

on:
  pull_request:
    paths:
      - '.github/workflows/hyp105-universal-referee-gates.yml'
      - 'docs/research/HYP-105-UNIVERSAL-REFEREE-REVIEW.md'
      - 'research/test_hyp105_universal_referee_gate.py'
      - 'research/hyp105_unconditional_original_deletion.py'
      - 'research/hyp105_universal_sextic_obstruction.py'
      - 'research/hyp105_bbo_resilience.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-original-source-adversarial-referee:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent W32 legal-correlated reassignment, true original six-ID matching, exact UDEL threshold budgets
        run: python -m unittest discover -s research -p 'test_hyp105_universal_referee_gate.py' -v
