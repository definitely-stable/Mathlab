name: hyp105-k3f2-diagonal-operator-contract

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3f2_diagonal_operator.py"
      - "research/test_hyp105_g5e2b3e1k3f2_diagonal_operator.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3F2-WEIGHTED-DIAGONALS-MOTIFS.md"
      - ".github/workflows/hyp105-k3f2-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  weighted-diagonal-and-motif-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent C4 opposite diagonal and original-column chord lifting falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3f2_diagonal_operator.py' -v
      - name: Deterministic genuine W32 W34 operator and chorded motif report
        run: python research/hyp105_g5e2b3e1k3f2_diagonal_operator.py
