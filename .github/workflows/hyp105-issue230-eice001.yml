name: hyp105-issue230-eice001-endpoint-energy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-original-endpoint-energy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Exact rational ORIGINAL W32 collision and fail-closed tests
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_endpoint_energy.py' -v
      - name: Independent full ORIGINAL W32 four-map energy census
        run: python research/hyp105_issue230_endpoint_energy.py
