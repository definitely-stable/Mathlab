name: hyp105-issue230-d6aa4xcyc-seven-joint-swap-frontier
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4xcyc_seven_joint_swap_frontier.py"
      - "research/test_hyp105_issue230_d6aa4xcyc_seven_joint_swap_frontier.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4XCYC-SEVEN-JOINT-SWAP-FRONTIER.md"
      - ".github/workflows/hyp105-issue230-d6aa4xcyc-seven-joint-swap-frontier.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-original-six-ID-sparse-derivative:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact original GQ six-ID swap derivative with independent historical GF5 and all 105 swaps
        run: |
          python -m unittest discover -s research -p "test_hyp105_issue230_d6aa4xcyc_seven_joint_swap_frontier.py" -v
  exact-original-seven-class-105-neighbor-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scheme: [S68, S72]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Entire 105 true-original full-global-g line-label transposition neighborhood
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          python research/hyp105_issue230_d6aa4xcyc_seven_joint_swap_frontier.py --scheme "$SCHEME" > /tmp/aa4xcyc-original-seven.json
          python - <<'PY'
          import json, os
          o=json.load(open("/tmp/aa4xcyc-original-seven.json"))
          assert o["slice"]=="HYP105-ISSUE230-D6-AA4-X-CYC-SEVEN-CLASS-LOCAL-SWAP-FRONTIER"
          assert o["all_h_exact_sparse_swap_derivative_identity"]
          assert o["finite_true_original_W32_exact_full_105_transpositions"]
          assert o["root_A"]==o["root_B"]==o["root_C"]=="OPEN"
          scheme=os.environ["SCHEME"]
          x=o["schemes"][scheme]
          assert x["neighbors_checked"]==105
          assert x["complete_global_line_bijections_compared"]==106
          assert x["baseline"]["S_seven"]=={"S68":68,"S72":72}[scheme]
          assert x["baseline"]["D6"]==0
          assert x["D6_zero_labelings_in_exact_neighborhood"]+x["D6_positive_labelings_in_exact_neighborhood"]==106
          assert x["min_S_witness"]["S_seven"]<=x["baseline"]["S_seven"]
          assert x["min_D6_zero_nonAA_witness"]["non_AA"]<=x["baseline"]["non_AA"]
          assert all(r["S_seven"]==r["D6"]+r["non_AA"] for r in x["pareto_frontier"])
          assert x["min_S_over_one_swap_neighborhood_only_NOT_global"]
          assert not x["all_h_adversarial_seven_class_obstruction_PROVED"]
          assert not x["all_h_counterexample_family_PROVED"]
          print("EXACT ORIGINAL",scheme,"105 GLOBAL SWAPS PASS",
                "min_S",x["min_S_witness"],
                "min_D6_zero",x["min_D6_zero_nonAA_witness"],
                "D6zero",x["D6_zero_labelings_in_exact_neighborhood"],
                "Pareto",x["pareto_frontier"])
          PY
