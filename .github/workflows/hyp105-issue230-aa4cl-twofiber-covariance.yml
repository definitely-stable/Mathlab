name: hyp105-issue230-aa4cl-twofiber-96map-original-covariance
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4cl_shared_four_point_fibers_covariance.py"
      - "research/test_hyp105_issue230_d6aa4cl_shared_four_point_fibers_covariance.py"
