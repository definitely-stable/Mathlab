          python-version: '3.12'
      - name: Integer 24x24 S4 six-transposition polynomial/traces/multiplicities, exact 9over16 covariance Poincare extremizer, 24 parity period-two counterexample
        run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4cl_shared_four_point_fibers_covariance.py' -v -k test_01
  real-original-W32-K6-four-cycle-overlap-full96:
