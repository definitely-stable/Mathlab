name: hyp105-c7-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c7-conditional-prefix-selector
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c7_conditional_prefix.py"
      - "research/test_hyp105_g5e2b3e1c7_conditional_prefix.py"
      - ".github/workflows/hyp105-c7-contract.yml"

permissions:
  contents: read

jobs:
  one-common-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent 720-prefix oracle, tower, original W32 greedy certificate
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c7_conditional_prefix.py' -v
      - name: Actual original W32 conditional right-map report
        run: python research/hyp105_g5e2b3e1c7_conditional_prefix.py
