name: hyp105-c7-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c7-fixed-map-minimum
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c7_adversarial_minimum.py"
      - "research/test_hyp105_g5e2b3e1c7_adversarial_minimum.py"
      - ".github/workflows/hyp105-c7-contract.yml"

permissions:
  contents: read

jobs:
  exact-common-permutation-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent full 7-factorial and 8-factorial minimum falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c7_adversarial_minimum.py' -v
      - name: Genuine W32 support-only relaxation with fixed GQ maps
        run: python research/hyp105_g5e2b3e1c7_adversarial_minimum.py
