name: hyp105-k3e-weighted-codegrees-contract

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3e_weighted_codegrees.py"
      - "research/test_hyp105_g5e2b3e1k3e_weighted_codegrees.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3E-WEIGHTED-CODEGREE-TAILS.md"
      - ".github/workflows/hyp105-k3e-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  c4-weighted-gq-falsifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent C4 diagonal oracle, physical source-star tails, exact mixed book triples
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3e_weighted_codegrees.py' -v
      - name: Deterministic genuine W32 W34 weighted-codegree report
        run: python research/hyp105_g5e2b3e1k3e_weighted_codegrees.py
