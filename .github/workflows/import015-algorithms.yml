name: import015-algorithms

on:
  push:
    branches:
      - "research/import-015-2026-algorithms"
  pull_request:
    paths:
      - "docs/research/catalog/literature.json"
      - "docs/research/catalog/LITERATURE.md"
      - "docs/research/catalog/LITERATURE-BY-RESEARCH.md"
      - "docs/research/IMPORT-015-ALGORITHM-RELATIONS.json"
      - "docs/research/RESEARCH-LITERATURE-015-2026-DAG-LZ77-AUTOMATA.md"
      - "research/literature.py"
      - "research/test_literature.py"
      - "research/test_import014_graph_ai.py"
      - "research/test_import015_algorithms.py"
      - "docs/research/UCT-005-D1B-CONDITIONAL-DEPENDENCY-REGISTER.json"
      - "research/test_uct005_d1b_conditional_audit.py"
      - ".github/workflows/import015-algorithms.yml"

permissions:
  contents: read

jobs:
  primary-source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Canonical primary source metadata and indices
        run: python research/literature.py --check
      - name: Full bibliography invariants
        run: python -m unittest discover -s research -p "test_literature.py"
      - name: Original IMPORT-012 source genealogy
        run: python -m unittest discover -s research -p "test_import012_source_genealogy.py"
      - name: IMPORT-013 source and model fences
        run: python -m unittest discover -s research -p "test_import013_graph_learning.py"
      - name: IMPORT-014 source and model fences
        run: python -m unittest discover -s research -p "test_import014_graph_ai.py"
      - name: IMPORT-015 SODA and ECCC sources
        run: python -m unittest discover -s research -p "test_import015_algorithms.py"
      - name: UCT-005 reviewed conditional hardness source inventory
        run: python -m unittest discover -s research -p "test_uct005_d1b_conditional_audit.py"
