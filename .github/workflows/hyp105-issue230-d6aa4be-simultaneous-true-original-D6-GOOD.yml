name: hyp105-issue230-d6aa4be-simultaneous-true-original-D6-GOOD
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4be_simultaneous_actual_original_D6_GOOD.py"
      - "research/test_hyp105_issue230_d6aa4be_simultaneous_actual_original_D6_GOOD.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4BE-SIMULTANEOUS-ORIGINAL-D6-GOOD-GLOBAL.md"
      - ".github/workflows/hyp105-issue230-d6aa4be-simultaneous-true-original-D6-GOOD.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rigorous-all-h-and-real-source-full-global-D6-GOOD:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Six rigorous true-original W32/W34 source/Hall/physical K6/GF5 AND GOOD groups and h5..80
        run: |
          python -m unittest discover -s research -p "test_hyp105_issue230_d6aa4be_simultaneous_actual_original_D6_GOOD.py" -v
  independent-real-original-W32-historical-D6-and-GOOD:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scheme: [lex, reverse, S68, S72]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construct one FULL original g with historical selected sixflag GF5 D6 AND literal opposite GOOD
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          PYTHONPATH=research python - <<'PY'
          import os,json
          from hyp105_issue230_projection import fixture
          from hyp105_g5e2b3e1b0_seven_signature import classify_seven_prechecked
          from hyp105_issue230_d6aa4aw_sharp_original_twoport_marginals import exact_TRUE_original_twoport_marginal_repair_frontier
          from hyp105_issue230_d6aa4be_simultaneous_actual_original_D6_GOOD import pin_original_D6_and_construct_global_good
          m=fixture(1,os.environ["SCHEME"])
          z=pin_original_D6_and_construct_global_good(m,verify_universal_guarantee=False)
          assert z["complete_original_line_g_realized"]
          g=z["actual_global_LINE_factor_images"]
          assert classify_seven_prechecked(z["source_original_six_distinct_incidence_IDs_Q"],
                    m["left_labels"],g,m["incidences"])=="D6"
          assert z["historical_seven_GF5_original_six_incidence_Q_class"]=="D6"
          q=exact_TRUE_original_twoport_marginal_repair_frontier(dict(m,right_labels=g))
          assert q["physically_opposite_ACTUAL_original_GOOD_D_centered_3flag_wedges"]==z["complete_GLOBAL_original_GOOD_charge"]
          assert z["complete_GLOBAL_original_GOOD_charge"]>=z["complete_GLOBAL_unpinned_original_GOOD_charge"]
          print(json.dumps({"s":2,"scheme":os.environ["SCHEME"],
             "true_original_selected_six_incidence_IDs_Q":z["source_original_six_distinct_incidence_IDs_Q"],
             "ONE_GLOBALLY_COMPLETE_right_map":True,
             "historical_selected_seven_GF5_six_ID_tag":"D6",
             "true_original_GOOD_opposite_threeflag_charge":z["complete_GLOBAL_original_GOOD_charge"],
             "original_six_LINE_factor_images_pinned_unchanged":True,
             "root230_all_global_fixed_f_g_NOT_PROVED":True},indent=2))
          PY
  all-dyadic-h5-through80-six-original-pins-and-GOOD-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NO fake high-h W3 geometry; exact physical missing graph K6 and original d-regular Hall + parent six-pin GOOD
        run: |
          PYTHONPATH=research python - <<'PY'
          from fractions import Fraction
          from hyp105_issue230_d6aa4be_simultaneous_actual_original_D6_GOOD import all_h_original_sixpin_D6_GOOD_math_certificate
          for h in range(5,81):
              s=1<<h;z=all_h_original_sixpin_D6_GOOD_math_certificate(s)
              assert z["six_ORIGINAL_LINE_image_pins_satisfy_parent_budget"]
              assert z["any_original_point_f_support_greedy_physical_K6"]
              assert z["any_original_right_E_support_greedy_physical_K6"]
              assert z["six_distinct_REAL_original_incidence_ID_matching_exists"]
              assert z["source_original_GOOD_3flag_lower"]>=Fraction(s**6,512)
              assert z["historic_GF5_D6_positive_six_ID_count_at_least_ONE_only"]==1
              assert z["source_good_3flag_to_seven_GF5_count_s6_NOT_proved"]
              assert z["root_230_A_B_C_OPEN"]
          print("true-original conditional theorem all dyadic h5..80 exact integer+Fraction: D6>=1 and GOOD>=s6/512 for ONE constructed g PASS")
          PY
