name: hyp105-aa4-low-projection-clean-AC-books

on:
  push:
    branches:
      - research/hyp105-aa4-low-projection-clean-books-review
    paths:
      - '.github/workflows/hyp105-aa4-low-projection-clean-AC-books.yml'
      - 'docs/research/HYP-105-AA4-LOW-PROJECTION-CLEAN-A-C-BOOKS.md'
      - 'research/hyp105_original_low_projection_clean_books.py'
      - 'research/hyp105_original_AC_independent_source_contraction.py'
      - 'research/test_hyp105_original_low_projection_clean_books.py'
  pull_request:
    paths:
      - '.github/workflows/hyp105-aa4-low-projection-clean-AC-books.yml'
      - 'docs/research/HYP-105-AA4-LOW-PROJECTION-CLEAN-A-C-BOOKS.md'
      - 'research/hyp105_original_low_projection_clean_books.py'
      - 'research/hyp105_original_AC_independent_source_contraction.py'
      - 'research/test_hyp105_original_low_projection_clean_books.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  true-original-GQ-clean-AC-books:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 20 independent ORIGINAL GQ projection clean books and four block certification
        run: python -m unittest discover -s research -p 'test_hyp105_original_low_projection_clean_books.py' -v
      - name: Fail-closed original source/book physical dual exact certificate
        shell: bash
        run: |
          python research/hyp105_original_low_projection_clean_books.py > clean-book-certificate.txt
          python - clean-book-certificate.txt <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding='utf-8').read().strip()
          tag='AA4_LOW_AC_CLEAN_PROJECTION_CERTIFICATE='
          assert raw.startswith(tag) and raw.count(tag)==1
          c=json.loads(raw[len(tag):])
          assert c['schema']=='mathlab.hyp105.original-low-projection-clean-AC-books.v1'
          assert c['parent_pr']==779 and c['issue']==230
          assert c['status']=='OPEN_WITH_FORMAL_BLOCKER'
          for k in (
              'newly_proved_original_projection_filtered_books_x_y',
              'all_h_true_GQ_three_projection_anchor_roles_exact_s2',
              'original_FULL_A_vs_CORE_C_never_conflated',
              'independent_all_h_four_physical_blocker_reverse_and_dual_books_proved',
              'all_h_weighted_fourth_trace_not_independent_path_probability',
              'exact_SOURCE_book_reduction_valid_but_NO_universal_B0_improvement_claim',
              'source_P3_to_BBo_full_inverse_not_newly_accepted',
              'no_numerical_C6_graph_constants_invented'):
              assert c[k] is True,k
          assert c['root_unweighted_seven_class_PROVED_A'] is False
          assert c['next_scientific_gate']=='ORIGINAL_P3_BBo_SIXSET_TWO_DIRECTION_INVERSE_AND_ROOT_DAG'
          cases=c['original_true_W32_W34_cases']
          assert len(cases)==7
          assert {(p['s'],p['mode'],p['core_scheme']) for p in cases}=={
              (2,'lex','full'),(2,'reverse','two_thirds'),(2,'shift','half'),
              (4,'lex','full'),(4,'reverse','two_thirds'),
              (4,'shift','half'),(4,'reverse','thin')}
          assert any(p['source_point_x']['removed_invalid_original_source_book_keys']>0 for p in cases)
          assert any(p['source_line_y']['removed_invalid_original_source_book_keys']>0 for p in cases)
          assert any(p['source_point_x']['actual_first_physical_blocker_paths']>0 or
                     p['source_line_y']['actual_first_physical_blocker_paths']>0 for p in cases)
          assert any(p['original_FULL_not_equal_CORE'] and (
              p['source_point_x']['original_anchor_triples_OUTSIDE_CORE']>0 or
              p['source_line_y']['original_anchor_triples_OUTSIDE_CORE']>0) for p in cases)
          assert any(p['original_paired_CORE_flags']==p['original_A_full_allowed_flags'] for p in cases)
          assert any(p['deletion_projection']['original_source_deleted_IDs']>0 for p in cases)
          for p in cases:
              s=p['s'];N=(s+1)**2*(s*s+1);V=(s+1)*(s*s+1)
              assert p['original_GQ_named_flags']==N
              assert p['ORIGINAL_physical_FULL_A_edges']==2*p['original_A_full_allowed_flags']
              assert p['ORIGINAL_physical_paired_CORE_edges']==2*p['original_paired_CORE_flags']
              assert p['true_genuine_offincidence_projection_count']==V*V-N
              assert p['each_original_GQ_source_flag_in_each_three_roles_exactly_s2']
              assert p['exact_TRUE_original_mixed_theta']>=0
              assert p['original_CORE_degree_weighted_trace4']<=(
                  p['original_CORE_actual_Delta']*p['original_CORE_trace4'])
              assert p['actual_four_blocker_union']<=p['actual_TRUE_endpoint_good_P3']
              b=p['original_ALL_four_blocker_counts']
              assert b.get('x1',0)==b.get('x2',0)
              assert b.get('y1',0)==b.get('y2',0)
              deleted=p['deletion_projection']
              for role in ('exact_bad_source_qell_role','exact_bad_source_pell_role',
                           'exact_bad_source_pr_role'):
                  assert deleted[role]==s*s*deleted['original_source_deleted_IDs']
              assert deleted['physical_deleted_endpoints_upper']<=deleted['all_h_deleted_physical_bound']
              for typ in ('source_point_x','source_line_y'):
                  z=p[typ]
                  assert z['full_historical_A_C_book']>=z['NEW_projection_clean_endpoint_good_A_C_book']
                  assert z['removed_invalid_original_source_book_keys']==(
                      z['full_historical_A_C_book']-z['NEW_projection_clean_endpoint_good_A_C_book'])
                  assert z['removed_invalid_original_source_book_keys']==sum(
                      z['original_filtered_reason_counts'].values())
                  assert z['actual_first_physical_blocker_paths']<=z['clean_true_first_two_walk_weight']
                  assert z['clean_true_first_two_walk_weight']**2 <= (
                      z['actual_first_physical_blocker_triples']*z['clean_exact_two_walk_square'])
                  assert z['clean_exact_two_walk_square']<=p['original_CORE_degree_weighted_trace4']
                  assert z['actual_first_physical_blocker_paths']**2<=(
                      z['NEW_projection_clean_endpoint_good_A_C_book']*
                      p['original_CORE_degree_weighted_trace4'])
                  assert z['clean_source_witness_is_left_invertible']
                  assert z['all_original_weighted_blocker_charge_exactly_checked']
              print('GENUINE_ORIGINAL_GQ_AC',s,p['mode'],p['core_scheme'],
                    'Z',deleted['original_source_deleted_IDs'],
                    'full',p['original_A_full_allowed_flags'],
                    'C',p['original_paired_CORE_flags'],
                    'good3',p['actual_TRUE_endpoint_good_P3'],
                    'blocked_union',p['actual_four_blocker_union'],
                    'Bx_old',p['source_point_x']['full_historical_A_C_book'],
                    'Bx_clean',p['source_point_x']['NEW_projection_clean_endpoint_good_A_C_book'],
                    'By_old',p['source_line_y']['full_historical_A_C_book'],
                    'By_clean',p['source_line_y']['NEW_projection_clean_endpoint_good_A_C_book'])
          print('ALL_H_ORIGINAL_GQ_PROJECTION_CLEAN_AC_BOOKS_PROVED_LOCALLY')
          print('ROOT_OPEN_WITH_FORMAL_BLOCKER')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hyp105-original-GQ-clean-AC-book-source-certificate
          path: clean-book-certificate.txt
          retention-days: 14
