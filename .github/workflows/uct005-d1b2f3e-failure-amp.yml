name: uct005-d1b2f3e-failure-stage-amp
on:
  push:
    branches:
      - "research/uct005-d1b2f3e-*"
    paths:
      - "research/uct005_d1b2f3e_failure_amp.py"
      - "research/test_uct005_d1b2f3e_failure_amp.py"
      - ".github/workflows/uct005-d1b2f3e-failure-amp.yml"
  pull_request:
    paths:
      - "research/uct005_d1b2f3e_failure_amp.py"
      - "research/test_uct005_d1b2f3e_failure_amp.py"
      - ".github/workflows/uct005-d1b2f3e-failure-amp.yml"
permissions:
  contents: read
jobs:
  adversarial-stage-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent corrupted/withheld/padding old PIN, second-pass race and failed retries
        run: python -m unittest discover -s research -p 'test_uct005_d1b2f3e_failure_amp.py' -v
      - name: Reproduce exact P-byte speculative abort costs and zero authority forgery
        run: python research/uct005_d1b2f3e_failure_amp.py
      - name: Same contract predecessor and theorem-tree regressions
        run: |
          python -m unittest discover -s research -p 'test_uct005_d1b2f3d_deferred_output.py' -v
          python -m unittest discover -s research -p 'test_uct005_d1b2f3c_onepass_speculative_pin.py' -v
          python -m unittest discover -s research -p 'test_uct005_d1b2f2_streamed_pin_bitmap.py' -v
          python -m unittest discover -s research -p 'test_uct005_tree.py' -v
