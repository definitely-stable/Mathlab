name: uct005-d1b2c-eager-pin-reclaim

on:
  push:
    branches:
      - "research/uct005-d1b2c-*"
    paths:
      - "research/uct005_d1b2c_eager_pin_reclaim.py"
      - "research/test_uct005_d1b2c_eager_pin_reclaim.py"
      - "docs/research/UCT-005-G3-B2-D1B2C-EAGER-PIN-RECLAIM.md"
      - ".github/workflows/uct005-d1b2c-eager-pin-reclaim.yml"
  pull_request:
    paths:
      - "research/uct005_d1b2c_eager_pin_reclaim.py"
      - "research/test_uct005_d1b2c_eager_pin_reclaim.py"
      - "docs/research/UCT-005-G3-B2-D1B2C-EAGER-PIN-RECLAIM.md"
      - ".github/workflows/uct005-d1b2c-eager-pin-reclaim.yml"

permissions:
  contents: read

jobs:
  pin-aware-reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Independent F1 eager reclaim versus scanning oracle
        run: python -m unittest discover -s research -p 'test_uct005_d1b2c_eager_pin_reclaim.py' -v
      - name: Finite same-model differential cost report
        run: python research/uct005_d1b2c_eager_pin_reclaim.py
