name: hyp105-issue230-jpkc008-source-hall-coherence

on:
  pull_request:
    paths:
      - "research/hyp105_issue230_jpkc008_source_hall_coherence.py"
      - "research/test_hyp105_issue230_jpkc008_source_hall_coherence.py"
      - "docs/research/HYP-105-ISSUE230-JPKC-008-ORIGINAL-HALL-SOURCE-COHERENCE.md"
      - ".github/workflows/hyp105-issue230-jpkc008-source-hall-coherence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-original-source-hall:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check 207025 genuine ORIGINAL GQ 3x3 Hall source pairs and complete W32 source demands
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_jpkc008_source_hall_coherence.py' -v
      - name: Emit original matched demand certificates, W32 full and real W34 D4 targeted
        run: python research/hyp105_issue230_jpkc008_source_hall_coherence.py --w34-seeds 8
