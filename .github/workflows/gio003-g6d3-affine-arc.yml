name: gio003-g6d3-affine-arc

on:
  push:
    branches:
      - research/gio003-g6d3-affine-arc-cayley-transfer
    paths:
      - 'research/gio_t3d3_affine_arc.py'
      - 'research/test_gio_t3d3_affine_arc.py'
      - 'docs/research/GIO-003-G6D3-AFFINE-ARC-CAYLEY-TRANSFER.md'
      - '.github/workflows/gio003-g6d3-affine-arc.yml'
  pull_request:
    paths:
      - 'research/gio_t3d3_affine_arc.py'
      - 'research/test_gio_t3d3_affine_arc.py'
      - 'docs/research/GIO-003-G6D3-AFFINE-ARC-CAYLEY-TRANSFER.md'
      - '.github/workflows/gio003-g6d3-affine-arc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine-arc-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and independently validate original q-arc sources
        run: |
          python -m py_compile research/gio_t3d3_affine_arc.py research/test_gio_t3d3_affine_arc.py
          python -m unittest discover -s research -p 'test_gio_t3d3_affine_arc.py' -v
      - name: Produce exact Fourier/Cayley, arc source and T3 ledger certificate
        shell: bash
        run: |
          python research/gio_t3d3_affine_arc.py --out gio003-g6d3-affine-arc-transfer.json
          python - <<'PY'
          import json
          from fractions import Fraction as Q
          from pathlib import Path
          z=json.loads(Path("gio003-g6d3-affine-arc-transfer.json").read_text())
          assert z["schema"]=="mathlab.gio003.g6d3.affine-arc-source-transfer.v1"
          assert z["claim"]=="STRUCTURAL_AFFINE_ARC_TO_QUADRATIC_T3_ALL_FAMILIES"
          assert z["issue"]==793 and z["parent_G6D2_HEAD"]=="6605187776e0d5d15aa70c2df123a39d55ac85f6"
          assert z["projective_arc_incidence_construction_prior_art"]
          assert z["generalized_Wenger_Cayley_character_method_prior_art"]
          assert z["new_Mathlab_contribution_conditional_six_source_ID_transfer"]
          assert z["no_unconditional_every_quadratic_source_T3"]
          for a in z["actual_finite_source_falsifiers"]:
              q=a["q"];f=a["Fourier"];arc=a["arc"]
              assert arc["projective_arc"]
              assert a["actual_girth_at_least_8"]
              assert a["actual_genuine_graph_NOT_synthetic_F"]
              assert a["actual_SOURCE_original_flags"]==q**4
              assert a["source_nongq_moore_excess"]==2*q*(q-1)
              assert a["original_missing_projections"]==q**3*2*q*(q-1)
              assert f["dual_characters_enumerated"]==q**3
              assert f["centered_BBt_eigenvalues"]==[0,q,2*q]
              assert f["centered_F0_norm_squared"]==max(q*(q-2)**2,8*q)
              if q>=5:
                  assert f["centered_F0_norm_squared"]<=(q-1)**3
                  assert f["minimal_integer_kappa"]==1
              print("G6D3_REAL_ARC",q,a["exponent"],a["scheme"],
                    "flags",a["actual_SOURCE_original_flags"],
                    "missing",a["original_missing_projections"],
                    "F0norm2",f["centered_F0_norm_squared"])
          assert len(z["actual_bad_source_negative_controls"])>=1
          for x in z["actual_bad_source_negative_controls"]:
              assert x["original_C6_rejected_by_independent_graph_checker"]
          assert not z["q16_nonarc_det_only"]["projective_arc"]
          six=z["true_binary_q8_novel_arc_historical_BBo_inverse"]
          assert six["q"]==8 and six["curve_power"]==4
          assert six["true_original_source_flags"]==4096
          assert six["original_missing_projection_count"]==57344
          assert six["actual_produced_original_BBo_sixsets"]==1
          assert six["original_FULL_survivors"]==6
          assert six["proper_CORE_owners"]==3
          assert 0<six["bounded_actual_physical_threewalks_examined"]<=3000000
          assert len(set(six["genuine_original_six_source_IDs"]))==6
          assert six["witness_uses_genuine_original_3flag_projection"]
          assert six["witness_vanishes_after_one_FULL_anchor_deleted"]
          assert six["manual_published_source_first_exactly_agree"]
          assert six["no_GQ_completion_or_synthetic_old_anchor"]
          print("G6D3_Q8_HISTORICAL_SOURCE_BBO",six["actual_produced_original_BBo_sixsets"],
                "FULL",six["original_FULL_survivors"],"CORE",six["proper_CORE_owners"])
          for e in z["infinite_binary_power4_arc_certificate"]:
              assert e["projective_arc_exactly_if_odd_e"]==(e["e"]%2==1)
              assert e["actual_infinite_nongq_family_when_e_odd_ge3"]==(e["e"]%2==1 and e["e"]>=3)
          theorem=z["general_affine_projective_q_arc_theorem"]
          assert theorem["fixed_parameters"]=={"b":1,"C":3,"kappa":1}
          assert theorem["all_HYP105_original_six_source_flags"]
          assert theorem["no_GQ_template_needed_by_source_proof"]
          assert theorem["no_unrestricted_T3_or_ASET_claim"]
          ledger=theorem["exact_formal_parameter_ledger"]
          assert ledger["FORMAL_ONLY"]
          assert ledger["closure"]["four_LOW_errors_each_below_eps"]
          e=Q(ledger["closure"]["eps"]);rho=Q(ledger["closure"]["rho"])
          rr=int(ledger["closure"]["sufficient_r0"])
          mm=ledger["moments"];ss=ledger["selector"]
          assert mm["improper"]<=e*rr
          assert mm["E"]**2<=e**2*rr
          assert mm["blocker_D"]**8<=e**8*rr
          assert 12*rho*ss["q3"]**2*mm["L6"]<=e**2
          print("PASS_GIO003_G6D3_EXACT_AFFINE_ARC_T3_TRANSFER")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gio003-g6d3-affine-arc-t3-exact
          path: gio003-g6d3-affine-arc-transfer.json
          retention-days: 90
