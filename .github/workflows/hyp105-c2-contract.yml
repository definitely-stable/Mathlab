name: hyp105-c2-contract

on:
  push:
    branches:
      - research/hyp105-b32e1c2-johnson-harmonic-gate
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c2_johnson_gate.py"
      - "research/test_hyp105_g5e2b3e1c2_johnson_gate.py"
      - ".github/workflows/hyp105-c2-contract.yml"

permissions:
  contents: read

jobs:
  exact-johnson-falsifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact K6 target W2 W3 and 105 real W32 correlated swaps
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c2_johnson_gate.py' -v
      - name: Rational-only C2 source and physical-target report
        run: python research/hyp105_g5e2b3e1c2_johnson_gate.py
