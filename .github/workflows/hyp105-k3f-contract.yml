name: hyp105-k3f-shared-source-spectral-contract

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3f_shared_source_spectrum.py"
      - "research/test_hyp105_g5e2b3e1k3f_shared_source_spectrum.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3F-SHARED-SOURCE-SPECTRUM.md"
      - ".github/workflows/hyp105-k3f-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared-source-transport-falsifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent GQ strongly regular spectral parameters and original matrix transport
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3f_shared_source_spectrum.py' -v
      - name: Genuine W32 W34 shared-star threshold report
        run: python research/hyp105_g5e2b3e1k3f_shared_source_spectrum.py
