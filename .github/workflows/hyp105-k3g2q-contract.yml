name: hyp105-k3g2q-gq-anchor-permanents

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3g2q_gq_anchor_permanents.py"
      - "research/test_hyp105_g5e2b3e1k3g2q_gq_anchor_permanents.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3G2Q-GQ-ANCHOR-PERMANENTS.md"
      - ".github/workflows/hyp105-k3g2q-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-original-gq-square-permanent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Standalone 4x4 permanent girth-8, source-square and signed residual falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3g2q_gq_anchor_permanents.py' -v
      - name: Four exact coherent original-and-dual full source permanent reports once
        run: |
          python research/hyp105_g5e2b3e1k3g2q_gq_anchor_permanents.py > /tmp/hyp105-k3g2q.json
          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path
          r=json.loads(Path("/tmp/hyp105-k3g2q.json").read_text())
          assert r["slice"]=="HYP-105-E1-K3-G2-Q"
          assert r["branch_A_B"]=="OPEN"
          assert r["all_h_anchor_square_permanent_identity_proved"] is True
          assert r["all_h_two_family_P2_proved"] is False
          assert r["all_h_seven_family_P7_proved"] is False
          proof=r["complete_4x4_girth8_permanent_proof"]
          assert proof["all_binary_4x4_matrices"]==65536
          assert proof["girth_at_least_eight_matrices"]==16217
          assert proof["permanent_histogram"]=={"0":11321,"1":4824,"2":72}
          assert proof["sharp_permanent_max"]==2
          caps=r["all_h_GQ_original_source_caps"]
          assert caps["6"]["combined_upper"]==6
          assert caps["6"]["old_per_intersecting_GQ_pair_cap"]==81
          assert caps["14"]["combined_upper"]==625
          assert caps["14"]["new_per_intersecting_GQ_pair_cap"]==2970
          assert caps["35"]["V"]==585
          models=r["true_original_GQ_models"]
          assert [m["name"] for m in models]==["lex","hardest-M"]
          assert len(models)==2
          for m in models:
              assert m["U_BA"]+m["U_AB"]<=m["S_seven"]
              for side,expected in (("original_BA",m["U_BA"]),
                                    ("true_original_dual_AB",m["U_AB"])):
                  d=m[side]
                  assert d["W32_original_sixsets_all"]==5005
                  assert d["full_C0_independent_sixset_reconstruction"] is True
                  assert d["previous_81_e_bound_replaced_by_6_e"] is True
                  assert set(d["all_permanent_zero_one_two_terms"])=={"0","1","2"}
                  assert d["square_counts_by_original_point"]==[3]*15
                  assert d["actual_physical_BA_overlap"]==expected
                  assert d["permanent_one_source_mass"]+d["permanent_two_source_mass"]==d["original_sixsource_mass"]
                  assert d["source_from_permanents_mass"]==d["original_sixsource_mass"]
                  assert d["rank56_sum"]==d["independent_full_Johnson_rank56"]
                  assert (Fraction(*d["rank56_permanent_one_contribution"])+
                          Fraction(*d["rank56_permanent_two_contribution"])
                          ==Fraction(*d["rank56_sum"]))
          hard=models[1]
          assert (hard["U_BA"],hard["U_AB"],hard["S_seven"])==(36,39,86)
          assert hard["P2_margin"]==[757,143]
          assert hard["original_BA"]["original_sixsource_mass"]==4984
          assert hard["true_original_dual_AB"]["original_sixsource_mass"]==5302
          assert hard["original_BA"]["rank56_sum"]==[-56,11]
          assert hard["true_original_dual_AB"]["rank56_sum"]==[-167,42]
          # Hosted exact numerical original source seal; counts refer to
          # 96525 local anchor-square matrices PER original/dual source.
          expected=[
              ("lex","original_BA",5000,3076,[91537,4976,12],
               [4,3],[4976,24],[-145,308],[13,231],[-383,924]),
              ("lex","true_original_dual_AB",5793,3347,[90746,5765,14],
               [5,3],[5765,28],[628,231],[226,231],[122,33]),
              ("hardest-M","original_BA",4984,3068,[91554,4958,13],
               [6,5],[4958,26],[-3097,462],[745,462],[-56,11]),
              ("hardest-M","true_original_dual_AB",5302,3091,[91226,5296,3],
               [4,3],[5296,6],[-1937,462],[50,231],[-167,42]),
          ]
          index={m["name"]:m for m in models}
          for name,side,mass,support,hist,ratio,pmmass,c1,c2,c56 in expected:
              d=index[name][side]
              assert d["original_sixsource_mass"]==mass
              assert d["source_positive_sixsets"]==support
              assert [d["all_permanent_zero_one_two_terms"][str(i)]
                      for i in range(3)]==hist
              assert sum(hist)==96525
              assert d["largest_actual_source_weight_over_GQ_meeting_pairs"]==ratio
              assert [d["permanent_one_source_mass"],
                      d["permanent_two_source_mass"]]==pmmass
              assert d["rank56_permanent_one_contribution"]==c1
              assert d["rank56_permanent_two_contribution"]==c2
              assert d["rank56_sum"]==c56
          print(json.dumps(r,sort_keys=True,indent=2))
          PY
