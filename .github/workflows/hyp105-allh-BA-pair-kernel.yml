name: hyp105-allh-BA-pair-kernel

on:
  pull_request:
    paths:
      - '.github/workflows/hyp105-allh-BA-pair-kernel.yml'
      - 'docs/research/HYP-105-ALLH-BA-PAIR-SECOND-MOMENT.md'
      - 'research/hyp105_allh_BA_overlap_second_moment.py'
      - 'research/test_hyp105_allh_BA_overlap_second_moment.py'
      - 'research/hyp105_g5e2b3e1a_fixed_leading.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  true-original-W32-BA-full-second-moment-and-all-a-template:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent K6 K7 K8 exact 2factor pair kernels and genuine original W32 B/A second moments
        run: python -m unittest discover -s research -p 'test_hyp105_allh_BA_overlap_second_moment.py' -v
