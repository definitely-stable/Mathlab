name: hyp105-issue230-d6aa4y2-sign-robust-original-mode-gram
on:
  pull_request:
    paths:
      - "research/hyp105_issue230_d6aa4y2_original_mode_gradient.cpp"
      - "research/hyp105_issue230_d6aa4y2_original_mode_gram.py"
      - "research/hyp105_issue230_d6aa4y2_original_signed_conflicts.cpp"
      - "research/test_hyp105_issue230_d6aa4y2_original_mode_gram.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4Y2-SIGN-ROBUST-ORIGINAL-MODE-GRAM.md"
      - ".github/workflows/hyp105-issue230-d6aa4y2-sign-robust-original-mode-gram.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-seven-mode-all-h-historical-mathematical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent true ORIGINAL Q mode Gram, seven-GF5 weighted mixed-charge and sign-indefinite falsifiers
        run: |
          python -m unittest discover -s research -p "test_hyp105_issue230_d6aa4y2_original_mode_gram.py" -v
  all-11236-real-original-signed-gram-sector-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scheme: [S68, S72]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile separately audited C++20 true original 106x106 GF5 and seven-class gradient energies
        run: |
          g++ -std=c++20 -O3 -Wall -Wextra -pedantic -o /tmp/hyp105-y-original research/hyp105_issue230_d6aa4ycyc_bilateral_original_join.cpp
          g++ -std=c++20 -O3 -Wall -Wextra -pedantic -o /tmp/hyp105-y2-grad research/hyp105_issue230_d6aa4y2_original_mode_gradient.cpp
          g++ -std=c++20 -O3 -Wall -Wextra -pedantic -o /tmp/hyp105-y2-conflict research/hyp105_issue230_d6aa4y2_original_signed_conflicts.cpp
      - name: Verify every original six-incidence seven-mode signed Hessian against exact integer Cauchy for every complete global pair
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          python research/hyp105_issue230_d6aa4y2_original_mode_gram.py --scheme "$SCHEME" --native-matrix /tmp/hyp105-y-original --native-gradient /tmp/hyp105-y2-grad --native-conflicts /tmp/hyp105-y2-conflict --conflict-output /tmp/y2-original-conflicts.tsv --matrix-output /tmp/y2-original-matrix.tsv --energy-output /tmp/y2-original-energy.tsv --summary /tmp/y2-original-gram.json > /tmp/y2-stdout.json
          python - <<'PY'
          import csv,json,os
          scheme=os.environ["SCHEME"]
          r=json.load(open("/tmp/y2-original-gram.json"))
          assert r["scheme"]==scheme
          assert r["slice"]=="HYP105-ISSUE230-D6-AA4-Y2-ALL-H-ORIGINAL-SEVEN-MODE-GRAM-CHARGE"
          assert r["global_true_original_physically_injective_maps"]
          assert r["all_h_unconditional_original_seven_source_mode_gram_and_sign_robust_cauchy"]
          z=r["signed_original_gradient"]
          assert z["genuine_full_correlated_source_mixed_pairs_checked"]==11025
          assert z["all_11236_global_pairs_AND_7_class_gram_Cauchy_checks"]=="PASS"
          assert z["all_11236_weighted_51palette_source_gram_Cauchy_checks"]=="PASS"
          assert z["all_11236_seven_class_source_sector_budget_checks"]=="PASS"
          assert z["signed_original_mixed_negative_count"]=={"S68":8286,"S72":8642}[scheme]
          assert z["signed_original_mixed_negative_count"]+z["signed_original_mixed_positive_count"]+z["signed_original_mixed_zero_count"]==11025
          assert z["extremal_negative_signed_original_global_witness"]["mixed_delta_S"]=={"S68":-70,"S72":-76}[scheme]
          assert not z["all_h_seven_S_omega_s6_PROVED"]
          assert r["root_A"]==r["root_B"]==r["root_C"]=="OPEN"
          with open("/tmp/y2-original-matrix.tsv",newline="") as fp:
              assert len(list(csv.DictReader(fp,delimiter="\t")))==11236
          with open("/tmp/y2-original-energy.tsv",newline="") as fp:
              assert len(list(csv.DictReader(fp,delimiter="\t")))==212
          c=r["exact_original_conflicts"]
          assert c["exact_original_same_mode_signed_quad_separation_ALL_H_THEOREM"]
          assert c["finite_all_11236_original_conflicts_and_historical_GF5_51palette_exact"]=="PASS"
          assert c["genuine_original_mixed_pairs"]==11025
          assert c["negative_mixed_S_pairs"]==z["signed_original_mixed_negative_count"]
          assert c["worst_negative_original_signed_mode_transport_witness"]["mixed_delta_S"]=={"S68":-70,"S72":-76}[scheme]
          assert c["worst_negative_original_signed_mode_transport_witness"]["harmful_opposite_sign_original_modes"]>=abs(c["worst_negative_original_signed_mode_transport_witness"]["mixed_delta_S"])
          assert c["worst_negative_original_signed_mode_transport_witness"]["harmful_opposite_sign_original_modes"]<c["worst_negative_original_signed_mode_transport_witness"]["sector_energy_Cauchy_rounded_budget"]
          assert c["minimum_sign_robust_exact_conflict_lower_over_11236"]=={"S68":6,"S72":2}[scheme]
          assert c["all_11236_complete_global_pair_original_seven_S_positive_CERTIFIED_BY_CHARGE"]
          assert isinstance(c["minimum_weighted_GF5_sign_robust_exact_conflict_lower_over_11236"],int)
          with open("/tmp/y2-original-conflicts.tsv",newline="") as fp:
              assert len(list(csv.DictReader(fp,delimiter="\t")))==11236
          print("EXACT ORIGINAL SIGNED HARMFUL VERSUS FAVORABLE MODES",scheme,c)
          print("GENUINE ORIGINAL ALL-H SIGN-ROBUST SOURCE MODE GRAM PASS",
              "scheme",scheme,"negative mixed interactions",
              z["signed_original_mixed_negative_count"],
              "worst genuine negative signed charge",
              z["extremal_negative_signed_original_global_witness"],
              "minimum certified finite signed lower",
              z["minimum_S_signed_sector_lower_bound_across_complete_finite_grid"])
          PY
      - name: Preserve complete original GF5 matrix and all source mode derivative energies
        uses: actions/upload-artifact@v4
        with:
          name: hyp105-aa4y2-gram-original-${{ matrix.scheme }}
          path: |
            /tmp/y2-original-matrix.tsv
            /tmp/y2-original-energy.tsv
            /tmp/y2-original-conflicts.tsv
            /tmp/y2-original-gram.json
          retention-days: 90
          if-no-files-found: error
