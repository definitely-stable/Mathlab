name: dag002-g1c2d-atomic-pages

on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/dag002_g1c2d_atomic_pages.py'
      - 'research/test_dag002_g1c2d_atomic_pages.py'
      - 'docs/research/DAG-002-ALG-001-G1-C2-D-ATOMIC-PAGES.md'
      - '.github/workflows/dag002-g1c2d-atomic-pages.yml'
  pull_request:
    paths:
      - 'research/dag002_g1c2d_atomic_pages.py'
      - 'research/test_dag002_g1c2d_atomic_pages.py'
      - 'docs/research/DAG-002-ALG-001-G1-C2-D-ATOMIC-PAGES.md'
      - '.github/workflows/dag002-g1c2d-atomic-pages.yml'

permissions:
  contents: read

jobs:
  exact-atomic-page-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact root and page ledger diagnostic
        run: python research/dag002_g1c2d_atomic_pages.py
      - name: Exhaustive crash cut and DAG source oracles
        run: python -m unittest discover -s research -p 'test_dag002_g1c2d_atomic_pages.py' -v
