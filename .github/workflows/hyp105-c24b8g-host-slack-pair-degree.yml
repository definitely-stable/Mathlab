name: hyp105-c24b8g-host-slack-pair-degree

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1c24b8g_host_slack_pair_degree.py"
      - "research/test_hyp105_g5e2b3e1c24b8g_host_slack_pair_degree.py"
      - "research/hyp105_g5e2b3e1c24b8g_w32_and_s4_host_witness.py"
      - "docs/research/HYP-105-G5-E2-B3-E1C24B8G-HOST-SLACK-PAIR-DEGREE.md"
      - ".github/workflows/hyp105-c24b8g-host-slack-pair-degree.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  all-h-host-slack-and-original-W32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: B8-G exhaustive independent K4 injection and K4-K6 deleted-edge falsifiers
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1c24b8g_host_slack_pair_degree.py' -v
      - name: B8-G original W32 source score and s4 synthetic n85 host-slack proof oracle
        run: python research/hyp105_g5e2b3e1c24b8g_w32_and_s4_host_witness.py
