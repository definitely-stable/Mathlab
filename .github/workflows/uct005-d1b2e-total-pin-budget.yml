name: uct005-d1b2e-total-pin-budget

on:
  push:
    branches:
      - "research/uct005-d1b2e-*"
    paths:
      - "research/uct005_d1b2e_total_pin_budget.py"
      - "research/test_uct005_d1b2e_total_pin_budget.py"
      - "docs/research/UCT-005-G3-B2-D1B2E-TOTAL-PIN-BUDGET.md"
      - ".github/workflows/uct005-d1b2e-total-pin-budget.yml"
  pull_request:
    paths:
      - "research/uct005_d1b2e_total_pin_budget.py"
      - "research/test_uct005_d1b2e_total_pin_budget.py"
      - "docs/research/UCT-005-G3-B2-D1B2E-TOTAL-PIN-BUDGET.md"
      - ".github/workflows/uct005-d1b2e-total-pin-budget.yml"

permissions:
  contents: read

jobs:
  exact-full-audit-and-trusted-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Independent complete-audit and same-F1 total trusted-budget oracles
        run: python -m unittest discover -s research -p 'test_uct005_d1b2e_total_pin_budget.py' -v
      - name: Exact conditional trust/remote-page tradeoff
        run: python research/uct005_d1b2e_total_pin_budget.py
