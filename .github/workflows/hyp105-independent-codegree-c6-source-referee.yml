name: hyp105-independent-codegree-c6-source-referee

on:
  pull_request:
    paths:
      - '.github/workflows/hyp105-independent-codegree-c6-source-referee.yml'
      - 'docs/research/HYP-105-INDEPENDENT-CODEGREE-C6-SOURCE-REFEREE.md'
      - 'research/hyp105_independent_codegree_c6_source_referee.py'
      - 'research/test_hyp105_independent_codegree_c6_source_referee.py'
      - 'research/hyp105_full_physical_degree_tail.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-ordinary-c6-and-true-original-D6:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive 69632 ordinary bipartite graphs and genuine ORIGINAL W32/W34 source C6-D6 lift
        run: python -m unittest discover -s research -p 'test_hyp105_independent_codegree_c6_source_referee.py' -v
