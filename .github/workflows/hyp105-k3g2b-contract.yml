name: hyp105-k3g2b-original-source-pair-kernel

on:
  pull_request:
    paths:
      - "research/hyp105_g5e2b3e1k3g2b_origin_pair_kernel.py"
      - "research/test_hyp105_g5e2b3e1k3g2b_origin_pair_kernel.py"
      - "docs/research/HYP-105-G5-E2-B3-E1K3G2B-ORIGIN-PAIR-KERNEL.md"
      - ".github/workflows/hyp105-k3g2b-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  original-source-pair-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent original-source closure and geometry oracles
        run: python -m unittest discover -s research -p 'test_hyp105_g5e2b3e1k3g2b_origin_pair_kernel.py' -v