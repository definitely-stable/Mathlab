name: gio003-g6d6-positive-squared-tail

on:
  push:
    branches:
      - research/gio003-g6d6-positive-squared-tail
    paths:
      - 'research/gio_t3d6_squared_tail.py'
      - 'research/test_gio_t3d6_squared_tail.py'
      - 'docs/research/GIO-003-G6D6-SQUARED-POSITIVE-TAIL.md'
      - '.github/workflows/gio003-g6d6-positive-squared-tail.yml'
  pull_request:
    paths:
      - 'research/gio_t3d6_squared_tail.py'
      - 'research/test_gio_t3d6_squared_tail.py'
      - 'docs/research/GIO-003-G6D6-SQUARED-POSITIVE-TAIL.md'
      - '.github/workflows/gio003-g6d6-positive-squared-tail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-schatten2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and independently test original-source squared-tail and factor Frobenius
        run: |
          python -m py_compile research/gio_t3d6_squared_tail.py research/test_gio_t3d6_squared_tail.py
          python -m unittest discover -s research -p 'test_gio_t3d6_squared_tail.py' -v
      - name: Generate and independently assert all original-source and formal T3 certificates
        shell: bash
        run: |
          python research/gio_t3d6_squared_tail.py --out gio003-g6d6-positive-squared-tail.json
          python - <<'PY'
          import json
          from fractions import Fraction as Q
          from pathlib import Path
          z=json.loads(Path('gio003-g6d6-positive-squared-tail.json').read_text())
          assert z["schema"]=="mathlab.gio003.g6d6.positive-squared-tail.v1"
          assert z["issue"]==793
          assert z["parent_G6D5_HEAD"]=="39ef3c1643a3be06e068b69730545e8095223229"
          assert z["claim"]=="CONDITIONAL_T3_QUADRATIC_EXCESS_POSITIVE_SQUARED_TAIL"
          assert z["truly_infinite_Wenger_fixed_cutoff_separation_from_D5_nu2"]
          assert z["same_Wenger_family_already_in_D2_by_different_gate"]
          assert z["no_new_infinite_graph_family_or_unrestricted_T3"]
          cases=z["actual_original_source_independent_finite_checks"]
          assert len(cases)>=10
          for x in cases:
              r=x["r"];a=x["source_constants"]
              assert x["original_source_not_synthetic_F"] and x["no_GQ_completion"]
              for side in ("point","line"):
                  W=x["exact_positive_square_tail_PSD_certificates"][side]
                  H=x["independently_checked_original_factor_Frobenius"][side]
                  E=Q(W["witness_trace_W_squared"])
                  assert E**2<=W["positive_squared_tail_fixed_M"]**2*r**7
                  assert W["exact_seventh_power_gate"]
                  assert W["exact_symmetric_W_PSD"]["negative"]==0
                  assert W["exact_symmetric_dominance_PSD"]["negative"]==0
                  assert H["factor_incidence_frob_squared"]==H["direct_pair_overlap_squared"]
                  assert H["factor_incidence_frob_squared"]<=H["factor_trace_critical_bound"]
              assert x["original_source_J"]<=a["original_owner_conflict_J0"]*r**4
              assert x["point_original_Gram"]**2<=a["original_pencil_Gram_G0"]**2*r**11
              assert x["line_original_Gram"]**2<=a["original_pencil_Gram_G0"]**2*r**11
              print("G6D6_REAL_ORIGINAL",x["kind"],x["scheme"],"r",r,
                    "pointE2",x["exact_positive_square_tail_PSD_certificates"]["point"]["witness_trace_W_squared"],
                    "lineE2",x["exact_positive_square_tail_PSD_certificates"]["line"]["witness_trace_W_squared"])
          symbolic=z["published_prime_power_Wenger_asymptotic_symbolic_certificate"]
          assert len(symbolic)>=12
          assert all(w["D6_squared_tail_gate"] for w in symbolic)
          assert all(not w["D5_first_tail_gate"] for w in symbolic if w["q"]>=16)
          assert all(w["published_W2_requires_prime_power_q"] for w in symbolic)
          for w in z["exact_all_order_four_error_formal_ledgers"]:
              assert w["FORMAL_ONLY"] and w["no_unrestricted_T3"]
              assert w["source"]["no_D5_first_positive_tail_gate"]
              assert w["source"]["no_D4_outlier_count_gate"]
              f=w["fixed_before_source"]
              c=w["closure"];m=w["moments"];s=w["selector"]
              R=int(c["sufficient_r0"]);e=Q(c["eps"]);rho=Q(c["rho"])
              assert m["improper"]<=e*R
              assert m["E"]**2<=e*e*R
              assert m["blocker_D"]**8<=e**8*R
              assert 12*f["balance_b"]**2*rho*s["q3"]**2*m["L6"]<=e*e
              print("G6D6_FORMAL",f,"rho",c["rho"],"delta",c["delta"])
          print("PASS_GIO003_G6D6_ORIGINAL_SCHATTEN2_SQUARED_TAIL")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gio003-g6d6-original-source-schatten2-psd-and-ledgers
          path: gio003-g6d6-positive-squared-tail.json
          retention-days: 90
