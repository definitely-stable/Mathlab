name: hyp105-aa4-original-gq-rectangle-middle3

on:
  pull_request:
    paths:
      - '.github/workflows/hyp105-aa4-original-gq-rectangle-middle3.yml'
      - 'docs/research/HYP-105-AA4-ORIGINAL-GQ-RECTANGLE-K22-MIDDLE3.md'
      - 'research/hyp105_original_full_w34_weighted_risk_referee.py'
      - 'research/test_hyp105_original_gq_rectangle_middle3_referee.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-gq-no-k22-middle-owner-three:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent genuine ORIGINAL GQ sharp middle3 source, mass ledgers, and forged K22 rejection
        run: python -m unittest discover -s research -p 'test_hyp105_original_gq_rectangle_middle3_referee.py' -v
      - name: Strict eight FULL SOURCE W32 W34 exact source owner and GQ K22 certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          python -u research/hyp105_original_full_w34_weighted_risk_referee.py | tee proof/hyp105-original-gq-rectangle-middle3.json.log
          python - <<'PYCODE'
          from pathlib import Path
          from fractions import Fraction
          import json
          lines=Path('proof/hyp105-original-gq-rectangle-middle3.json.log').read_text().splitlines()
          p='AA4_FULL_W34_RISK_CERTIFICATE='
          assert len(lines)==1 and lines[0].startswith(p), 'single strict ORIGINAL source certificate'
          o=json.loads(lines[0][len(p):])
          assert o['schema']=='mathlab.hyp105.original-full-W34-risk-effective-multiplicity.v1'
          assert o['issue']==230 and o['status']=='OPEN_WITH_FORMAL_BLOCKER'
          assert o['root_PROVED_A'] is False
          assert o['all_h_global_B_over_M_below_3_over_4_PROVED'] is False
          assert o['numerical_external_C6_graph_constants_claimed'] is False
          assert o['ASET_exponent_claimed'] is False
          assert o['all_h_true_original_GQ_rectangle_no_K2_2_strict_max_three_middle_paths'] is True
          assert o['all_h_distinct_same_middle_flag_paths_are_source_incompatible'] is True
          assert o['all_h_middle_owner_coarse_effective_multiplicity_safety_gate'] is True
          rows=o['complete_independently_verified_original_W32_W34_source_census']
          assert len(rows)==8
          assert [r['full_true_coordinate_proper_P3_count'] for r in rows[:5]]==[1346,1154,838,83892,82846]
          assert [r['max_same_original_middle_flag_P3_per_bin'] for r in rows]==[2,3,3,2,2,2,2,2]
          assert rows[1]['genuine_original_three_same_middle_flag_path_witness'] is not None
          assert len(rows[1]['genuine_original_three_same_middle_flag_path_witness']['three_real_paths'])==3
          for r in rows:
              n=r['source_GQ_point_count']
              audit=r['true_original_GQ_rectangle_K22_audit']
              core=r['source_retained_original_flags']
              inc=audit['original_source_incidence_K2_2_independent_audit']
              assert inc['original_point_pairs_checked']==n*(n-1)//2
              assert inc['original_line_pairs_checked']==n*(n-1)//2
              assert inc['max_original_lines_shared_by_two_points']<=1
              assert inc['max_original_points_shared_by_two_lines']<=1
              assert inc['true_source_incidence_K2_2_free'] is True
              assert audit['four_neighbor_K2_2_incidence_forbidden'] is True
              assert audit['max_real_neighbors_of_source_rectangle_corners']<=3
              assert audit['all_h_middle_flag_same_endpoint_P3_upper']==3
              assert audit['original_source_rectangle_vertex_pairs_exhaustively_checked']>0
              assert r['true_source_physical_edges']==2*core
              assert r['full_source_complete_census'] is True
              M=Fraction(r['M']);B=Fraction(r['B']);G=Fraction(r['G'])
              D=Fraction(r['diagonal_source_path_weight'])
              middle=Fraction(r['exact_original_middle_owner_quadratic_energy'])
              same=Fraction(r['exact_incompatible_B_same_original_middle_flag'])
              different=Fraction(r['exact_incompatible_B_different_original_middle_flags'])
              assert M==B+G and B==same+different
              assert same==middle-D and D<=middle<=3*D
              assert same>=0 and different>=0
              assert Fraction(r['exact_same_middle_original_owner_bad_fraction_of_total_B'])==(same/B if B else 0)
              assert 0<=Fraction(r['source_midflag_only_sufficient_safe_M_share'])<=1
              assert 0<=r['source_midflag_only_sufficient_safe_endpoint_bins']<=r['true_original_ordered_endpoint_bins']
              assert 0<=r['same_middle_original_flag_incompatible_ordered_path_pairs']<r['true_original_ordered_same_endpoint_path_pairs']
              assert r['max_same_original_middle_flag_P3_per_bin']<=3
              assert Fraction(r['B_over_M'])<Fraction(3,4)
              assert r['all_h_hybrid_sufficient_global_B_below_three_quarters'] is True
          assert Fraction(rows[3]['B_over_M'])==Fraction(
              6455794325016624278974180549344,34112625017517015558762952579019)
          print('ACCEPT true ORIGINAL GQ K22-free sharp middle3 + exact source bad-middle partitions; root remains OPEN')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: hyp105-original-gq-no-k22-middle3-proof
          path: proof/hyp105-original-gq-rectangle-middle3.json.log
