name: hyp105-issue230-eice003h-spectral-source-fibres

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  true-original-gq-spectral-source-fibres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: EICE-003-H true GQ polynomial, every original middle double-star and family load
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_spectral_source_fibres.py' -v
      - name: W32 W34 exact original spectral-fibre and blocked five-source report
        run: python research/hyp105_issue230_spectral_source_fibres.py
      - name: EICE-003-G original five-source blocked localization full regressions
        run: python -m unittest discover -s research -p 'test_hyp105_issue230_five_source_blocked_search.py'
