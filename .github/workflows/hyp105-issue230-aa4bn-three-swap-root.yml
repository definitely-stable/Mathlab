          python-version: '3.12'
      - name: h22 through 80 exact BIGINT source GQ line badness O(s), 8 physical bad endpoints, actual pinned C6 with third fixed image, invalid source fail-closed
        run: |
          PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bn_three_swap_original_cherry.py' -v -k test_01
          PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4bn_three_swap_original_cherry.py' -v -k test_06
  five-true-W32-fixed-f-g-original-three-factor-swaps:
