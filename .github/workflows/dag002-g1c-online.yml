name: dag002-g1c-online

on:
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/dag002_g1c_online.py'
      - 'research/test_dag002_g1c_online.py'
      - 'docs/research/DAG-002-ALG-001-G1-C1-ONLINE-CONSISTENCY.md'
      - '.github/workflows/dag002-g1c-online.yml'
  pull_request:
    paths:
      - 'research/dag002_g1c_online.py'
      - 'research/test_dag002_g1c_online.py'
      - 'docs/research/DAG-002-ALG-001-G1-C1-ONLINE-CONSISTENCY.md'
      - '.github/workflows/dag002-g1c-online.yml'

permissions:
  contents: read

jobs:
  exact-online-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed-model certificate and scoped no-novelty ledger
        run: python research/dag002_g1c_online.py
      - name: Independent exhaustive minimax and bounded-program tests
        run: python -m unittest discover -s research -p 'test_dag002_g1c_online.py' -v
