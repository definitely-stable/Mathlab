name: gio003-g6e4-gq-zero-psd-matching

on:
  push:
    branches:
      - research/gio003-g6e4-zero-psd-gq-matching
    paths:
      - 'research/gio_t3e4_gq_zero_psd.py'
      - 'research/test_gio_t3e4_gq_zero_psd.py'
      - 'docs/research/GIO-003-G6E4-ZERO-PSD-GQ-MATCHINGS.md'
      - '.github/workflows/gio003-g6e4-gq-zero-psd-matching.yml'
  pull_request:
    paths:
      - 'research/gio_t3e4_gq_zero_psd.py'
      - 'research/test_gio_t3e4_gq_zero_psd.py'
      - 'docs/research/GIO-003-G6E4-ZERO-PSD-GQ-MATCHINGS.md'
      - '.github/workflows/gio003-g6e4-gq-zero-psd-matching.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-zero-psd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genuine GQ induced original sources, source G6-D7 zero-W, integer d-matching tests
        run: |
          python -m py_compile research/gio_t3e4_gq_zero_psd.py research/test_gio_t3e4_gq_zero_psd.py
          python -m unittest discover -s research -p 'test_gio_t3e4_gq_zero_psd.py' -v
      - name: Produce and assert original source zero-local-PSD JSON
        shell: bash
        run: |
          python research/gio_t3e4_gq_zero_psd.py --out gio003-g6e4-zero-psd-original.json
          python - <<'PY'
          import json
          from fractions import Fraction as Q
          from pathlib import Path
          a=json.loads(Path('gio003-g6e4-zero-psd-original.json').read_text())
          assert a["schema"]=="mathlab.gio003.g6e4.gq-matching-zero-psd.v1"
          assert a["issue"]==793
          assert a["parent_G6E3_HEAD"]=="568d07c9a4c6b44b1833ba6fa6a11fc139a56635"
          assert a["new_structural_GQ_submatrix_minus_bounded_matchings"]
          assert a["existing_G6D7_original_PSD_rowtop_source_gate_APPLIED"]
          assert a["no_synthetic_F_and_no_assumed_positive_trace_tail"]
          assert a["no_unrestricted_T3_or_new_GF5_ASET_exponent"]
          cases=a["true_original_girth8_sources_and_both_typed_flags"]
          assert len(cases)==6
          expected={("E1",3): (21,63,6,0,2),
                    ("E1",4): (56,224,16,0,2),
                    ("E2-ODD",7): (266,1596,110,14,4),
                    ("E3-EVEN",8): (416,2912,157,24,3)}
          for x in cases:
              key=x["family"],x["q"]
              assert (x["original_source_points"],
                      x["original_source_flags"],x["original_Moore_excess"],
                      x["original_matching_flags_removed"],x["ell"])==expected[key]
              assert x["actual_original_parent_subset_minus_matching"]
              assert x["both_types_original_W_zero_source_gate"]
              assert x["M_zero_fixed_before_labels"]
              assert x["rowtop_W_zero_exact"]==0
              assert x["no_D2_F0_norm_or_positive_tail_hypothesis"]
              assert x["independent_original_point_conflicts"]<=x["direct_trace_conflict_cap"]
              assert x["independent_original_line_conflicts"]<=x["direct_trace_conflict_cap"]
              assert x["exact_original_total_J"]==(
                  x["independent_original_point_conflicts"]+
                  x["independent_original_line_conflicts"])
              for s in x["exact_source_small_Sylvester_zero_W"].values():
                  assert s["W_PSD_exact_inertia"]["negative"]==0
                  assert s["W_dominance_PSD_exact_inertia"]["negative"]==0
                  assert s["local"]["exact_rowtop_energy"]=="0"
              print("G6E4_TRUE_GQ_ORIGINAL_SOURCE",x["family"],x["q"],
                    x["scheme"],"flags",x["original_source_flags"],
                    "matching",x["original_matching_flags_removed"],
                    "cutoff",x["ell"],"W=0 M=0")
          gates={(x["q"],x["d"],x["ell"]):x[
              "W_zero_on_both_original_types_sufficient"]
              for x in a["all_order_exact_integer_sqrt_gate_witnesses"]}
          for x in ((7,1,3),(8,1,2),(17,1,2),(32,2,2)):
              assert gates[x] is False
          for x in ((3,0,2),(7,1,4),(8,1,3),(18,1,2),(64,2,2),(128,3,2)):
              assert gates[x] is True
          assert [(z["d"],z["ell"],z["integer_q_tail_threshold"])
                  for z in a["automatic_all_integer_q_tail_thresholds"]]==[
                     (0,2,3),(1,4,6),(1,3,8),(1,2,18),(2,2,54),(3,2,109)]
          ledgers=a["inherited_G6D7_ZERO_ROW_TOP_FORMAL_ledgers"]
          assert len(ledgers)==4
          for item in ledgers:
              l=item["inherited_G6D7_FORMAL_only_ledger"]
              assert l["FORMAL_ONLY"]
              f=l["fixed_before_source"]
              assert f["local_M"]==0
              c=l["closure"];m=l["moments"];s=l["selector"]
              r=int(c["sufficient_r0"]);eps=Q(c["eps"]);rho=Q(c["rho"])
              assert m["improper"]<=eps*r
              assert m["E"]**2<=eps**2*r
              assert m["D"]**8<=eps**8*r
              assert 12*f["balance_b"]**2*rho*s["q3"]**2*m["L6"]<=eps**2
              assert Q(c["delta"])>0
              print("G6E4_FORMAL_ONLY",item["regime"],f,"rho",c["rho"],"delta",c["delta"])
          print("PASS_GIO003_G6E4_REAL_GQ_MATCHING_ZERO_POSITIVE_PSD_ROW_TOP")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gio003-g6e4-original-gq-matching-zero-positive-PSD
          path: gio003-g6e4-zero-psd-original.json
          retention-days: 90
