name: uct005-d1b2f2-stream-pin-bitmap

on:
  push:
    branches:
      - "research/uct005-d1b2f2-*"
    paths:
      - "research/uct005_d1b2f2_stream_pin_bitmap.py"
      - "research/test_uct005_d1b2f2_stream_pin_bitmap.py"
      - "docs/research/UCT-005-G3-B2-D1B2F2-STREAM-PIN-BITMAP.md"
      - ".github/workflows/uct005-d1b2f2-stream-pin-bitmap.yml"
  pull_request:
    paths:
      - "research/uct005_d1b2f2_stream_pin_bitmap.py"
      - "research/test_uct005_d1b2f2_stream_pin_bitmap.py"
      - "docs/research/UCT-005-G3-B2-D1B2F2-STREAM-PIN-BITMAP.md"
      - ".github/workflows/uct005-d1b2f2-stream-pin-bitmap.yml"

permissions:
  contents: read

jobs:
  two-pass-paged-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Independent same-F1, transient buffer and adversarial staging falsifiers
        run: python -m unittest discover -s research -p 'test_uct005_d1b2f2_stream_pin_bitmap.py' -v
      - name: Reproducible two-pass byte/page reference comparison
        run: python research/uct005_d1b2f2_stream_pin_bitmap.py
