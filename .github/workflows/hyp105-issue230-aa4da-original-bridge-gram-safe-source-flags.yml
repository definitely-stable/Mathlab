          python-version: "3.12"
      - name: Genuine W3 h1..110 analytic all-h >=96 original source bridge Gram SAFE-positive moment inequality exact big integers, h95/96 gate
        run: PYTHONPATH=research python -m unittest discover -s research -p 'test_hyp105_issue230_d6aa4da_bridge_gram_safe_source_flags.py' -v -k test_01
