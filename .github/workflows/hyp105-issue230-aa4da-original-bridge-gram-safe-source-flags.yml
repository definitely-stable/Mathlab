      - "research/test_hyp105_issue230_d6aa4da_bridge_gram_safe_source_flags.py"
      - "docs/research/HYP-105-ISSUE230-D6AA4DA-BRIDGE-GRAM-SAFE-ORIGINAL-FLAGS.md"
